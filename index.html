<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

h1 { color: #1ed760; }

p { color: #aaa; line-height: 1.6; }

.box {
  background: #202020;
  padding: 22px;
  border-radius: 12px;
  margin-top: 20px;
}

#pasteArea {
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 30px 20px;
  text-align: center;
  cursor: text;
  outline: none;
}

#pasteArea:focus {
  background: #292929;
}

#pasteArea.dragging {
  background: #303030;
}

#file {
  display: block;
  margin: 15px auto;
  max-width: 100%;
  color: white;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 250px;
  margin-top: 15px;
  border-radius: 8px;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
}

#result {
  width: 100%;
  height: 500px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>Spotify 화면을 캡처한 뒤 Ctrl + V로 붙여넣으세요.</p>

<section class="box">

  <div id="pasteArea" tabindex="0">
    <h3>📋 여기를 클릭한 뒤 Ctrl + V</h3>
    <p>또는 이미지를 이 영역에 드래그하세요.</p>
  </div>

  <input id="file" type="file" accept="image/*" multiple>

  <img id="preview" alt="이미지 미리보기">

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="인식된 텍스트가 한 영역씩 한 줄로 표시됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const fileInput = document.getElementById("file");
const pasteArea = document.getElementById("pasteArea");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

const queue = [];

let worker = null;
let processing = false;
let generation = 0;
let previewURL = null;

// 붙여넣기 영역 클릭 시 키보드 포커스
pasteArea.addEventListener("click", () => {
  pasteArea.focus();
});

// 파일 선택
fileInput.addEventListener("change", () => {
  addImages(Array.from(fileInput.files));
  fileInput.value = "";
});

// 페이지 어디에서든 이미지 붙여넣기
document.addEventListener("paste", event => {
  const clipboard = event.clipboardData;
  if (!clipboard) return;

  const images = [];

  // 클립보드 파일 항목 확인
  if (clipboard.items) {
    for (const item of clipboard.items) {
      if (item.kind === "file" && item.type.startsWith("image/")) {
        const file = item.getAsFile();
        if (file) images.push(file);
      }
    }
  }

  // items에 이미지가 없으면 files도 확인
  if (!images.length && clipboard.files) {
    for (const file of clipboard.files) {
      if (file.type.startsWith("image/")) {
        images.push(file);
      }
    }
  }

  if (images.length) {
    event.preventDefault();
    addImages(images);
  }
});

// 드래그 앤 드롭
pasteArea.addEventListener("dragover", event => {
  event.preventDefault();
  pasteArea.classList.add("dragging");
});

pasteArea.addEventListener("dragleave", () => {
  pasteArea.classList.remove("dragging");
});

pasteArea.addEventListener("drop", event => {
  event.preventDefault();
  pasteArea.classList.remove("dragging");
  addImages(Array.from(event.dataTransfer.files));
});

// 이미지 추가
function addImages(files) {
  const images = files.filter(file =>
    file && file.type.startsWith("image/")
  );

  if (!images.length) {
    statusEl.textContent = "이미지 파일을 찾지 못했습니다.";
    return;
  }

  showPreview(images[0]);
  queue.push(...images);

  statusEl.textContent =
    `이미지 ${images.length}장 추가 완료`;

  processQueue();
}

// 미리보기
function showPreview(file) {
  if (previewURL) {
    URL.revokeObjectURL(previewURL);
  }

  previewURL = URL.createObjectURL(file);
  preview.src = previewURL;
  preview.style.display = "block";
}

// OCR 영역별 한 줄 출력
function extractRegions(data) {
  const regions = [];

  for (const block of (data.blocks || [])) {
    for (const paragraph of (block.paragraphs || [])) {
      for (const line of (paragraph.lines || [])) {
        const words = (line.words || [])
          .filter(word => word.text?.trim() && word.bbox)
          .sort((a, b) => a.bbox.x0 - b.bbox.x0);

        if (!words.length) continue;

        const averageHeight =
          words.reduce((sum, word) =>
            sum + Math.max(1, word.bbox.y1 - word.bbox.y0), 0
          ) / words.length;

        const gapLimit = averageHeight * 1.5;
        let current = [];
        let previous = null;

        function saveRegion() {
          if (!current.length) return;

          regions.push({
            text: current.map(w => w.text).join(" ").trim(),
            x: current[0].bbox.x0,
            y: Math.min(...current.map(w => w.bbox.y0))
          });

          current = [];
        }

        for (const word of words) {
          if (previous) {
            const gap = word.bbox.x0 - previous.bbox.x1;
            if (gap > gapLimit) saveRegion();
          }

          current.push(word);
          previous = word;
        }

        saveRegion();
      }
    }
  }

  regions.sort((a, b) => {
    if (Math.abs(a.y - b.y) < 10) return a.x - b.x;
    return a.y - b.y;
  });

  return regions.map(r => r.text).filter(Boolean).join("\n");
}

// OCR 실행
async function processQueue() {
  if (processing) return;

  processing = true;

  try {
    if (typeof Tesseract === "undefined") {
      throw new Error("OCR 라이브러리를 불러오지 못했습니다.");
    }

    if (!worker) {
      statusEl.textContent = "한국어·영어 OCR 엔진 준비 중...";

      worker = await Tesseract.createWorker("kor+eng", 1);

      await worker.setParameters({
        tessedit_pageseg_mode: "3",
        preserve_interword_spaces: "0"
      });
    }

    while (queue.length) {
      const file = queue.shift();
      const currentGeneration = generation;

      showPreview(file);
      statusEl.textContent = "글자 인식 중...";

      const response = await worker.recognize(
        file,
        {},
        { blocks: true, text: true }
      );

      if (currentGeneration !== generation) continue;

      let text = extractRegions(response.data);

      if (!text.trim()) {
        text = (response.data.text || "").trim();
      }

      if (text) {
        if (resultEl.value.trim()) resultEl.value += "\n\n";
        resultEl.value += text;
        resultEl.scrollTop = resultEl.scrollHeight;
      }

      statusEl.textContent =
        `인식 완료! 남은 이미지: ${queue.length}장`;
    }

  } catch (error) {
    console.error(error);
    statusEl.textContent = "OCR 오류: " + error.message;
    worker = null;
    queue.length = 0;

  } finally {
    processing = false;
  }
}

// 전체 복사
document.getElementById("copy").addEventListener("click", async () => {
  if (!resultEl.value.trim()) {
    alert("복사할 내용이 없습니다.");
    return;
  }

  try {
    await navigator.clipboard.writeText(resultEl.value);
    statusEl.textContent = "전체 복사 완료!";
  } catch {
    resultEl.select();
    const success = document.execCommand("copy");
    statusEl.textContent = success
      ? "전체 복사 완료!"
      : "복사에 실패했습니다.";
  }
});

// 초기화
document.getElementById("clear").addEventListener("click", () => {
  generation++;
  queue.length = 0;
  resultEl.value = "";
  fileInput.value = "";

  preview.style.display = "none";
  preview.removeAttribute("src");

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }

  statusEl.textContent = "초기화 완료.";
});
</script>

</body>
</html>
