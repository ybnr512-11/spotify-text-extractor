<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Track OCR</title>

<style>
* { box-sizing: border-box; }

body {
  background: #121212;
  color: #eee;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 24px;
}

main {
  max-width: 1000px;
  margin: auto;
}

h1 { color: #1ed760; }

.panel {
  background: #222;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
}

button {
  background: #1ed760;
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}

select, input {
  padding: 9px;
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 6px;
}

#drop {
  border: 2px dashed #1ed760;
  padding: 30px;
  text-align: center;
  border-radius: 10px;
}

table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  border: 1px solid #555;
  padding: 8px;
  text-align: left;
}

td[contenteditable] {
  background: #191919;
}

small, #status { color: #aaa; }

#preview {
  max-width: 100%;
  max-height: 200px;
  display: none;
}

.scroll { overflow-x: auto; }
</style>
</head>

<body>
<main>

<h1>🎵 Spotify Track OCR</h1>

<p>
화면 캡처 → Ctrl + V → 곡명·아티스트·앨범명 추출
</p>

<section class="panel">

<label>
인식 언어
<select id="lang">
  <option value="jpn+eng">일본어 + 영어</option>
  <option value="kor+eng">한국어 + 영어</option>
  <option value="chi_sim+eng">중국어 간체 + 영어</option>
  <option value="chi_tra+eng">중국어 번체 + 영어</option>
  <option value="eng+spa">영어 + 스페인어</option>
  <option value="eng">영어</option>
</select>
</label>

<p>
<small>
Spotify 곡 목록이 보이도록 캡처하세요.
언어를 바꾸면 다음 이미지부터 적용됩니다.
</small>
</p>

<div id="drop" tabindex="0">
<strong>📋 여기를 클릭하고 Ctrl + V</strong>
<p>또는 이미지 선택</p>
<input id="upload" type="file" accept="image/*" multiple>
</div>

<p id="status">대기 중</p>

<img id="preview" alt="캡처 미리보기">

</section>

<section class="panel">

<h2>
추출 결과 <small id="count">0곡</small>
</h2>

<button id="copy">📋 3열 전체 복사</button>
<button id="clear">초기화</button>

<div class="scroll">
<table>
<thead>
<tr>
<th>곡명</th>
<th>아티스트</th>
<th>앨범명</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<p>
<small>
셀을 클릭하면 수정할 수 있습니다.
엑셀에 붙여넣으면 각 항목이 별도 열로 들어갑니다.
OCR 결과는 반드시 확인하세요.
</small>
</p>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const $ = id => document.getElementById(id);

let busy = false;
let queue = [];
let workers = {};
let epoch = 0;

const tracks = [];


// 이미지 추가
function add(files) {
  queue.push(
    ...files.filter(f => f.type.startsWith("image/"))
  );
  run();
}


// Ctrl + V
document.addEventListener("paste", e => {

  const files = [
    ...(e.clipboardData?.items || [])
  ]
  .filter(i => i.type.startsWith("image/"))
  .map(i => i.getAsFile())
  .filter(Boolean);

  if (files.length) {
    e.preventDefault();
    add(files);
  }

});


// 이미지 업로드
$("upload").onchange = e => {
  add([...e.target.files]);
  e.target.value = "";
};


// 텍스트 정리
function clean(s) {
  return (s || "")
    .replace(/\s+/g, " ")
    .trim();
}


// 결과 표 생성
function render() {

  const body = $("rows");
  body.replaceChildren();

  tracks.forEach((t, i) => {

    const tr = document.createElement("tr");

    for (let k = 0; k < 3; k++) {

      const td = document.createElement("td");

      td.contentEditable = "true";
      td.textContent = t[k];

      td.addEventListener("input", () => {
        tracks[i][k] = td.textContent;
      });

      tr.append(td);
    }

    body.append(tr);
  });

  $("count").textContent = tracks.length + "곡";
}


// 이미지 영역 확대
function crop(canvas, x, y, w, h, scale = 3) {

  const out = document.createElement("canvas");

  out.width = Math.max(1, Math.round(w * scale));
  out.height = Math.max(1, Math.round(h * scale));

  const ctx = out.getContext("2d");

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, out.width, out.height);

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(
    canvas,
    x, y, w, h,
    0, 0, out.width, out.height
  );

  return out;
}


// 이미지 OCR
async function processImage(file, worker, token) {

  const url = URL.createObjectURL(file);

  let bitmap;

  try {

    bitmap = await createImageBitmap(file);

    const W = bitmap.width;
    const H = bitmap.height;

    const base = document.createElement("canvas");

    base.width = W;
    base.height = H;

    base.getContext("2d").drawImage(bitmap, 0, 0);

    $("preview").src = url;
    $("preview").style.display = "block";

    // Spotify 화면의 열 위치
    const titleX = Math.round(W * 0.155);
    const titleEnd = Math.round(W * 0.505);

    const albumX = Math.round(W * 0.512);
    const albumEnd = Math.round(W * 0.735);

    const top = Math.round(H * 0.16);
    const bottom = Math.round(H * 0.965);

    const height = bottom - top;


    // 영역별 OCR
    async function lines(x, width) {

      const region = crop(
        base, x, top, width, height, 3
      );

      const response = await worker.recognize(region);

      return (response.data.lines || [])
        .map(line => ({
          text: clean(line.text),
          y: (line.bbox.y0 + line.bbox.y1) / 6 / 3 + top
        }))
        .filter(line => line.text);
    }


    // 곡명 + 아티스트 영역
    const left = await lines(
      titleX,
      titleEnd - titleX
    );

    if (token !== epoch) return;


    // 앨범 영역
    const albums = await lines(
      albumX,
      albumEnd - albumX
    );

    if (token !== epoch) return;


    // 곡명과 아티스트 묶기
    const grouped = [];

    for (let i = 0; i < left.length; i++) {

      const line = left[i];
      const next = left[i + 1];

      const nextGap = next
        ? next.y - line.y
        : Infinity;

      const approxRow = H * 0.078;

      if (
        next &&
        nextGap > 0 &&
        nextGap < approxRow * 0.45
      ) {

        grouped.push({
          title: line.text,
          artist: next.text,
          y: line.y
        });

        i++;

      } else {

        grouped.push({
          title: line.text,
          artist: "",
          y: line.y
        });

      }
    }


    // 앨범명 연결
    const used = new Set();

    for (const g of grouped) {

      if (!g.title) continue;

      let best = -1;
      let distance = Infinity;

      albums.forEach((a, i) => {

        if (used.has(i)) return;

        const delta = Math.abs(a.y - g.y);

        if (delta < distance) {
          distance = delta;
          best = i;
        }

      });

      let album = "";

      if (
        best >= 0 &&
        distance < H * 0.035
      ) {

        album = albums[best].text;
        used.add(best);

      }

      tracks.push([
        g.title,
        g.artist,
        album
      ]);

    }

    render();

  } finally {

    bitmap?.close();
    URL.revokeObjectURL(url);

  }
}


// OCR 실행
async function run() {

  if (busy) return;

  busy = true;

  try {

    while (queue.length) {

      const file = queue.shift();
      const token = epoch;
      const lang = $("lang").value;

      $("status").textContent =
        "OCR 언어 데이터 준비 및 인식 중...";

      if (!window.Tesseract) {
        throw Error("OCR 라이브러리를 불러오지 못했습니다.");
      }

      if (!workers[lang]) {

        workers[lang] =
          await Tesseract.createWorker(lang);

      }

      if (token !== epoch) continue;

      await processImage(
        file,
        workers[lang],
        token
      );

      if (token === epoch) {

        $("status").textContent =
          "인식 완료! 결과를 확인하세요.";

      }

    }

  } catch (e) {

    $("status").textContent =
      "오류: " + e.message;

  } finally {

    busy = false;

    if (queue.length) run();

  }
}


// 초기화
$("clear").onclick = () => {

  epoch++;
  queue = [];
  tracks.length = 0;

  render();

  $("status").textContent = "초기화됨";
  $("preview").style.display = "none";

};


// 전체 복사
$("copy").onclick = async () => {

  if (!tracks.length) {
    alert("추출 결과가 없습니다.");
    return;
  }

  const text = tracks
    .map(t =>
      t.map(v =>
        v.replace(/[\t\r\n]+/g, " ")
      ).join("\t")
    )
    .join("\n");

  try {

    await navigator.clipboard.writeText(text);

    alert("복사 완료!");

  } catch {

    alert("복사 권한을 확인해 주세요.");

  }

};

</script>
</body>
</html>
