<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1200px;
  margin: auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 10px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.panel {
  background: #202020;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

button {
  padding: 11px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#file {
  margin: 10px 0;
  color: white;
}

#imageContainer {
  position: relative;
  display: none;
  width: fit-content;
  max-width: 100%;
  margin-top: 15px;
  border: 1px solid #555;
  overflow: hidden;
  user-select: none;
}

#sourceImage {
  display: block;
  max-width: 100%;
  max-height: 75vh;
  width: auto;
  height: auto;
  pointer-events: none;
}

#selectionLayer {
  position: absolute;
  inset: 0;
  cursor: crosshair;
  touch-action: none;
}

#selection {
  position: absolute;
  display: none;
  border: 2px solid #1ed760;
  background: rgba(30, 215, 96, 0.16);
  pointer-events: none;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
  line-height: 1.6;
}

#result {
  width: 100%;
  height: 300px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.8;
  resize: vertical;
}

#pasteArea {
  padding: 20px;
  border: 2px dashed #1ed760;
  border-radius: 10px;
  text-align: center;
  outline: none;
}

#pasteArea:focus {
  background: #292929;
}

#lastPreview {
  display: none;
  margin-top: 15px;
  padding: 12px;
  background: #151515;
  border: 1px solid #444;
  border-radius: 8px;
}

#lastPreview p {
  margin: 0 0 10px;
}

#lastCrop {
  display: block;
  max-width: 100%;
  max-height: 130px;
  background: #252525;
}

#review {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: #302719;
  border: 1px solid #8d672d;
  border-radius: 8px;
}

#reviewText {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  background: #151515;
  color: white;
  border: 1px solid #666;
  border-radius: 6px;
  font-size: 15px;
}

#reviewMessage {
  color: #f1c27d;
  line-height: 1.6;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
전체 화면을 캡처해서 붙여넣은 뒤,
추출할 글자 부분을 마우스로 드래그하세요.
</p>

<section class="panel">

  <div id="pasteArea" tabindex="0">
    📋 여기를 클릭하고 Ctrl + V로 이미지 붙여넣기
  </div>

  <input
    id="file"
    type="file"
    accept="image/*"
  >

  <div id="imageContainer">

    <img id="sourceImage" alt="캡처 이미지">

    <div id="selectionLayer">
      <div id="selection"></div>
    </div>

  </div>

  <div id="status">이미지를 넣어주세요.</div>

  <button id="retry" class="secondary" disabled>
    🔄 마지막 영역 다시 인식
  </button>

  <div id="lastPreview">
    <p>마지막으로 선택한 영역</p>
    <canvas id="lastCrop"></canvas>
  </div>

  <div id="review">
    <div id="reviewMessage">
      인식 결과를 확인해주세요.
    </div>

    <input
      id="reviewText"
      type="text"
      spellcheck="false"
      placeholder="필요하면 직접 수정하세요."
    >

    <button id="accept">
      결과 추가
    </button>

    <button id="discard" class="secondary">
      버리기
    </button>
  </div>

</section>

<section class="panel">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="드래그한 영역의 텍스트가 한 줄씩 추가됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const fileInput = $("file");
const pasteArea = $("pasteArea");

const imageContainer = $("imageContainer");
const sourceImage = $("sourceImage");

const selectionLayer = $("selectionLayer");
const selection = $("selection");

const statusEl = $("status");
const resultEl = $("result");

const retryButton = $("retry");
const lastPreview = $("lastPreview");
const lastCrop = $("lastCrop");

const review = $("review");
const reviewText = $("reviewText");
const reviewMessage = $("reviewMessage");

let worker = null;
let workerPromise = null;

let imageURL = null;

let dragging = false;
let startX = 0;
let startY = 0;

let imageVersion = 0;
let requestVersion = 0;

let lastSelection = null;

const tasks = [];
let processing = false;


// 붙여넣기 영역 클릭
pasteArea.addEventListener("click", () => {
  pasteArea.focus();
});


// 파일 선택
fileInput.addEventListener("change", event => {

  const file = event.target.files[0];

  if (file) {
    loadImage(file);
  }

  fileInput.value = "";

});


// Ctrl + V 붙여넣기
document.addEventListener("paste", event => {

  const items = Array.from(
    event.clipboardData?.items || []
  );

  const item = items.find(
    item => item.type.startsWith("image/")
  );

  if (item) {

    const file = item.getAsFile();

    if (file) {
      event.preventDefault();
      loadImage(file);
    }

  }

});


// 이미지 드래그 앤 드롭
pasteArea.addEventListener("dragover", event => {
  event.preventDefault();
});

pasteArea.addEventListener("drop", event => {

  event.preventDefault();

  const file = Array.from(event.dataTransfer.files)
    .find(file => file.type.startsWith("image/"));

  if (file) {
    loadImage(file);
  }

});


// 검토창 닫기
function hideReview() {

  review.style.display = "none";
  reviewText.value = "";

}


// 이미지 불러오기
function loadImage(file) {

  imageVersion++;
  requestVersion++;

  tasks.length = 0;

  lastSelection = null;

  retryButton.disabled = true;
  lastPreview.style.display = "none";

  hideReview();

  dragging = false;
  selection.style.display = "none";

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
  }

  imageURL = URL.createObjectURL(file);

  sourceImage.onload = () => {

    imageContainer.style.display = "block";

    statusEl.textContent =
      "이미지 준비 완료. 원하는 글자 영역을 드래그하세요.";

  };

  sourceImage.src = imageURL;

}


// 선택 영역 좌표
function getPosition(event) {

  const rect = selectionLayer.getBoundingClientRect();

  return {
    x: Math.max(
      0,
      Math.min(event.clientX - rect.left, rect.width)
    ),
    y: Math.max(
      0,
      Math.min(event.clientY - rect.top, rect.height)
    )
  };

}


// 드래그 시작
selectionLayer.addEventListener("pointerdown", event => {

  if (!sourceImage.complete || !sourceImage.naturalWidth) {
    return;
  }

  event.preventDefault();

  dragging = true;

  const pos = getPosition(event);

  startX = pos.x;
  startY = pos.y;

  selection.style.display = "block";

  selection.style.left = startX + "px";
  selection.style.top = startY + "px";
  selection.style.width = "0px";
  selection.style.height = "0px";

  selectionLayer.setPointerCapture(event.pointerId);

});


// 드래그 중
selectionLayer.addEventListener("pointermove", event => {

  if (!dragging) return;

  event.preventDefault();

  const pos = getPosition(event);

  const left = Math.min(startX, pos.x);
  const top = Math.min(startY, pos.y);

  const width = Math.abs(pos.x - startX);
  const height = Math.abs(pos.y - startY);

  selection.style.left = left + "px";
  selection.style.top = top + "px";
  selection.style.width = width + "px";
  selection.style.height = height + "px";

});


// 드래그 종료
selectionLayer.addEventListener("pointerup", event => {

  if (!dragging) return;

  event.preventDefault();

  dragging = false;

  const pos = getPosition(event);

  const left = Math.min(startX, pos.x);
  const top = Math.min(startY, pos.y);

  const width = Math.abs(pos.x - startX);
  const height = Math.abs(pos.y - startY);

  selection.style.display = "none";

  if (width < 5 || height < 5) {
    return;
  }

  recognizeSelection(left, top, width, height);

});


// 드래그 취소
selectionLayer.addEventListener("pointercancel", () => {

  dragging = false;
  selection.style.display = "none";

});


// OCR 엔진 준비
async function getWorker() {

  if (worker) return worker;

  if (workerPromise) return workerPromise;

  workerPromise = (async () => {

    if (typeof Tesseract === "undefined") {
      throw new Error(
        "OCR 라이브러리를 불러오지 못했습니다."
      );
    }

    /*
      기존 정상 작동 코드의 OCR 설정 유지
    */

    const newWorker = await Tesseract.createWorker(
      "kor+eng"
    );

    await newWorker.setParameters({

      tessedit_pageseg_mode: "7",

      preserve_interword_spaces: "0"

    });

    worker = newWorker;

    return worker;

  })();

  try {

    return await workerPromise;

  } catch (error) {

    workerPromise = null;
    throw error;

  }

}


// 선택 영역만 OCR 작업으로 등록
function recognizeSelection(left, top, width, height) {

  const displayedWidth = sourceImage.clientWidth;
  const displayedHeight = sourceImage.clientHeight;

  const scaleX =
    sourceImage.naturalWidth / displayedWidth;

  const scaleY =
    sourceImage.naturalHeight / displayedHeight;

  const cropX = Math.round(left * scaleX);
  const cropY = Math.round(top * scaleY);

  const cropWidth = Math.round(width * scaleX);
  const cropHeight = Math.round(height * scaleY);

  if (cropWidth < 2 || cropHeight < 2) {
    return;
  }

  const canvas = document.createElement("canvas");

  canvas.width = cropWidth;
  canvas.height = cropHeight;

  const ctx = canvas.getContext("2d");

  /*
    기존 코드와 동일한 방식으로 자르기
    여백 추가 없음
    확대 없음
    흑백 변환 없음
  */

  ctx.drawImage(
    sourceImage,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    cropWidth,
    cropHeight
  );

  /*
    마지막 영역을 저장합니다.
    다시 인식할 때 동일한 이미지를 사용합니다.
  */

  lastSelection = canvas;

  retryButton.disabled = false;

  showLastCrop(canvas);

  hideReview();

  addTask(canvas);

}


// 마지막 선택 영역 미리보기
function showLastCrop(canvas) {

  lastCrop.width = canvas.width;
  lastCrop.height = canvas.height;

  const ctx = lastCrop.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(canvas, 0, 0);

  lastPreview.style.display = "block";

}


// OCR 작업 추가
function addTask(canvas) {

  tasks.push({
    canvas,
    version: imageVersion,
    request: ++requestVersion
  });

  statusEl.textContent =
    "선택한 영역을 인식 중...";

  processTasks();

}


// 마지막 영역 다시 인식
retryButton.addEventListener("click", () => {

  if (!lastSelection) {
    return;
  }

  hideReview();

  /*
    이전에 잘라낸 영역을 그대로 재사용합니다.
    새로운 이미지 변환은 하지 않습니다.
  */

  addTask(lastSelection);

});


// 인식 결과를 한 줄로 정리
function normalizeText(text) {

  return (text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// 기호 위주 결과인지 확인
function isMostlySymbols(text) {

  const letters = (
    text.match(/[A-Za-z가-힣0-9]/g) || []
  ).length;

  const visible = text.replace(/\s/g, "").length;

  if (!visible) {
    return true;
  }

  return letters / visible < 0.6;

}


// 결과 검증
function validateResult(response) {

  const text = normalizeText(
    response.data.text
  );

  const confidence = Number(
    response.data.confidence
  );

  if (!text) {

    return {
      accepted: false,
      text: "",
      reason: "글자가 인식되지 않았습니다."
    };

  }

  if (isMostlySymbols(text)) {

    return {
      accepted: false,
      text,
      reason: "기호가 너무 많아 자동 추가하지 않았습니다."
    };

  }

  /*
    신뢰도 60 미만은 자동 추가하지 않습니다.
    이 수치는 정확성 보장이 아닌 검토 기준입니다.
  */

  if (
    Number.isFinite(confidence) &&
    confidence < 60
  ) {

    return {
      accepted: false,
      text,
      reason:
        `인식 신뢰도가 낮습니다. (${confidence.toFixed(0)}점)`
    };

  }

  return {
    accepted: true,
    text,
    reason: ""
  };

}


// 결과 추가
function appendResult(text) {

  const cleaned = normalizeText(text);

  if (!cleaned) {
    return;
  }

  if (resultEl.value) {
    resultEl.value += "\n";
  }

  resultEl.value += cleaned;

  resultEl.scrollTop =
    resultEl.scrollHeight;

}


// 검토창 표시
function showReview(text, reason) {

  review.style.display = "block";

  reviewMessage.textContent =
    reason + " 아래 내용을 확인한 뒤 추가하거나 버리세요.";

  reviewText.value = text;

}


// OCR 작업 처리
async function processTasks() {

  if (processing) return;

  processing = true;

  try {

    const ocrWorker = await getWorker();

    while (tasks.length) {

      const task = tasks.shift();

      statusEl.textContent =
        "선택한 영역 글자 인식 중...";

      const response = await ocrWorker.recognize(
        task.canvas
      );

      /*
        다른 이미지를 불러왔거나
        더 최근 인식 요청이 있으면
        오래된 결과는 무시합니다.
      */

      if (
        task.version !== imageVersion ||
        task.request !== requestVersion
      ) {
        continue;
      }

      const validation = validateResult(response);

      if (validation.accepted) {

        hideReview();

        appendResult(validation.text);

        statusEl.textContent =
          "인식 완료. 다음 영역을 드래그하세요.";

      } else {

        showReview(
          validation.text,
          validation.reason
        );

        statusEl.textContent =
          "인식 결과 확인 필요. 자동 추가하지 않았습니다.";

      }

    }

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "OCR 오류: " + error.message;

    tasks.length = 0;

  } finally {

    processing = false;

  }

}


// 검토 결과 직접 추가
$("accept").addEventListener("click", () => {

  const text = normalizeText(
    reviewText.value
  );

  if (!text) {
    return;
  }

  appendResult(text);

  hideReview();

  statusEl.textContent =
    "확인한 결과를 추가했습니다.";

});


// 검토 결과 버리기
$("discard").addEventListener("click", () => {

  hideReview();

  statusEl.textContent =
    "인식 결과를 버렸습니다.";

});


// 전체 복사
$("copy").addEventListener("click", async () => {

  const text = resultEl.value;

  if (!text.trim()) {

    alert("복사할 내용이 없습니다.");
    return;

  }

  try {

    await navigator.clipboard.writeText(text);

    statusEl.textContent =
      "전체 복사 완료!";

  } catch {

    resultEl.select();

    document.execCommand("copy");

    statusEl.textContent =
      "전체 복사 완료!";

  }

});


// 초기화
$("clear").addEventListener("click", () => {

  imageVersion++;
  requestVersion++;

  tasks.length = 0;

  resultEl.value = "";

  dragging = false;

  selection.style.display = "none";

  lastSelection = null;

  retryButton.disabled = true;

  lastPreview.style.display = "none";

  hideReview();

  statusEl.textContent =
    "초기화 완료. 이미지를 넣어주세요.";

  imageContainer.style.display = "none";

  sourceImage.removeAttribute("src");

  if (imageURL) {

    URL.revokeObjectURL(imageURL);
    imageURL = null;

  }

});

</script>

</body>
</html>
