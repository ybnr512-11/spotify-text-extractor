<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #121212;
  color: #fff;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1300px;
  margin: auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 8px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.panel {
  background: #202020;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

#pasteArea {
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  outline: none;
  cursor: pointer;
}

#pasteArea:focus {
  background: #292929;
}

#file {
  margin-top: 15px;
  color: white;
  max-width: 100%;
}

#imageWrap {
  display: none;
  position: relative;
  width: fit-content;
  max-width: 100%;
  margin-top: 20px;
  border: 1px solid #555;
  line-height: 0;
  overflow: hidden;
}

#imageCanvas {
  display: block;
  max-width: 100%;
  height: auto;
}

#selectionCanvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  cursor: crosshair;
  touch-action: none;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
  line-height: 1.6;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: #fff;
}

#result {
  width: 100%;
  height: 300px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-family: Consolas, monospace;
  font-size: 15px;
  line-height: 1.8;
  resize: vertical;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
전체 화면을 캡처해 붙여넣은 뒤,
이미지 위에서 원하는 글자 영역을 드래그하세요.
</p>

<section class="panel">

  <div id="pasteArea" tabindex="0">
    📋 여기를 클릭한 뒤 Ctrl + V로 이미지 붙여넣기
  </div>

  <input id="file" type="file" accept="image/*">

  <div id="imageWrap">
    <canvas id="imageCanvas"></canvas>
    <canvas id="selectionCanvas"></canvas>
  </div>

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="panel">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="드래그한 영역의 텍스트가 한 줄씩 추가됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const pasteArea = $("pasteArea");
const fileInput = $("file");

const imageWrap = $("imageWrap");
const imageCanvas = $("imageCanvas");
const selectionCanvas = $("selectionCanvas");

const imageCtx = imageCanvas.getContext("2d");
const selectionCtx = selectionCanvas.getContext("2d");

const statusEl = $("status");
const resultEl = $("result");

let worker = null;
let workerPromise = null;

let dragging = false;
let startPoint = null;

let imageVersion = 0;
let processing = false;

const tasks = [];


// 붙여넣기 영역 클릭
pasteArea.addEventListener("click", () => {
  pasteArea.focus();
});


// 이미지 파일 선택
fileInput.addEventListener("change", event => {

  const file = event.target.files[0];

  if (file) {
    loadImage(file);
  }

  fileInput.value = "";

});


// Ctrl + V 이미지 붙여넣기
document.addEventListener("paste", event => {

  const clipboard = event.clipboardData;

  if (!clipboard) return;

  let file = null;

  for (const item of clipboard.items) {

    if (
      item.kind === "file" &&
      item.type.startsWith("image/")
    ) {

      file = item.getAsFile();
      break;

    }

  }

  if (!file && clipboard.files) {

    file = Array.from(clipboard.files)
      .find(f => f.type.startsWith("image/"));

  }

  if (file) {

    event.preventDefault();
    loadImage(file);

  }

});


// 이미지 드래그 앤 드롭
pasteArea.addEventListener("dragover", event => {
  event.preventDefault();
});

pasteArea.addEventListener("drop", event => {

  event.preventDefault();

  const file = Array.from(event.dataTransfer.files)
    .find(f => f.type.startsWith("image/"));

  if (file) {
    loadImage(file);
  }

});


// 이미지 불러오기
async function loadImage(file) {

  const currentVersion = ++imageVersion;

  tasks.length = 0;

  statusEl.textContent = "이미지 불러오는 중...";

  try {

    const bitmap = await createImageBitmap(file);

    if (currentVersion !== imageVersion) {
      bitmap.close();
      return;
    }

    imageCanvas.width = bitmap.width;
    imageCanvas.height = bitmap.height;

    selectionCanvas.width = bitmap.width;
    selectionCanvas.height = bitmap.height;

    imageCtx.clearRect(
      0,
      0,
      imageCanvas.width,
      imageCanvas.height
    );

    imageCtx.drawImage(bitmap, 0, 0);

    bitmap.close();

    imageWrap.style.display = "block";

    clearSelection();

    statusEl.textContent =
      "이미지 준비 완료. 글자가 있는 부분을 드래그하세요.";

  } catch (error) {

    statusEl.textContent =
      "이미지 오류: " + error.message;

  }

}


// 마우스 좌표를 원본 이미지 좌표로 변환
function getPoint(event) {

  const rect = selectionCanvas.getBoundingClientRect();

  const scaleX = selectionCanvas.width / rect.width;
  const scaleY = selectionCanvas.height / rect.height;

  const x = (event.clientX - rect.left) * scaleX;
  const y = (event.clientY - rect.top) * scaleY;

  return {

    x: Math.max(
      0,
      Math.min(x, selectionCanvas.width)
    ),

    y: Math.max(
      0,
      Math.min(y, selectionCanvas.height)
    )

  };

}


// 선택 박스 지우기
function clearSelection() {

  selectionCtx.clearRect(
    0,
    0,
    selectionCanvas.width,
    selectionCanvas.height
  );

}


// 선택 박스 그리기
function drawSelection(start, end) {

  clearSelection();

  const x = Math.min(start.x, end.x);
  const y = Math.min(start.y, end.y);

  const width = Math.abs(end.x - start.x);
  const height = Math.abs(end.y - start.y);

  selectionCtx.fillStyle = "rgba(30, 215, 96, 0.18)";
  selectionCtx.strokeStyle = "#1ed760";
  selectionCtx.lineWidth = 2;

  selectionCtx.fillRect(x, y, width, height);
  selectionCtx.strokeRect(x, y, width, height);

}


// 드래그 시작
selectionCanvas.addEventListener("pointerdown", event => {

  if (!imageCanvas.width || !imageCanvas.height) {
    return;
  }

  event.preventDefault();

  dragging = true;
  startPoint = getPoint(event);

  selectionCanvas.setPointerCapture(event.pointerId);

  drawSelection(startPoint, startPoint);

});


// 드래그 중
selectionCanvas.addEventListener("pointermove", event => {

  if (!dragging || !startPoint) return;

  event.preventDefault();

  const endPoint = getPoint(event);

  drawSelection(startPoint, endPoint);

});


// 드래그 종료
selectionCanvas.addEventListener("pointerup", event => {

  if (!dragging || !startPoint) return;

  event.preventDefault();

  dragging = false;

  const endPoint = getPoint(event);

  const x = Math.min(startPoint.x, endPoint.x);
  const y = Math.min(startPoint.y, endPoint.y);

  const width = Math.abs(endPoint.x - startPoint.x);
  const height = Math.abs(endPoint.y - startPoint.y);

  startPoint = null;

  clearSelection();

  if (width < 5 || height < 5) {
    return;
  }

  addSelectionTask(x, y, width, height);

});


// 드래그 취소
selectionCanvas.addEventListener("pointercancel", () => {

  dragging = false;
  startPoint = null;

  clearSelection();

});


// 선택 영역 OCR 작업 등록
function addSelectionTask(x, y, width, height) {

  const sx = Math.floor(x);
  const sy = Math.floor(y);

  const sw = Math.min(
    imageCanvas.width - sx,
    Math.ceil(width)
  );

  const sh = Math.min(
    imageCanvas.height - sy,
    Math.ceil(height)
  );

  if (sw <= 0 || sh <= 0) return;

  const cropCanvas = document.createElement("canvas");

  cropCanvas.width = sw;
  cropCanvas.height = sh;

  const ctx = cropCanvas.getContext("2d");

  /*
    원본 이미지를 그대로 잘라냅니다.
    흑백 변환, 색상 변경, 확대 없음.
  */

  ctx.drawImage(
    imageCanvas,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    sw,
    sh
  );

  tasks.push({
    canvas: cropCanvas,
    version: imageVersion
  });

  statusEl.textContent =
    `선택 영역 추가 완료. 대기 중: ${tasks.length}개`;

  processTasks();

}


// OCR 엔진 준비
async function getWorker() {

  if (worker) return worker;

  if (workerPromise) return workerPromise;

  workerPromise = (async () => {

    if (typeof Tesseract === "undefined") {

      throw new Error(
        "OCR 라이브러리를 불러오지 못했습니다."
      );

    }

    const newWorker = await Tesseract.createWorker(
      "kor+eng",
      1
    );

    await newWorker.setParameters({

      /*
        선택한 영역을 한 줄로 인식
      */

      tessedit_pageseg_mode: "7",

      preserve_interword_spaces: "0"

    });

    worker = newWorker;

    return worker;

  })();

  try {

    return await workerPromise;

  } catch (error) {

    workerPromise = null;
    throw error;

  }

}


// OCR 실행
async function processTasks() {

  if (processing) return;

  processing = true;

  try {

    statusEl.textContent = "OCR 엔진 준비 중...";

    const ocrWorker = await getWorker();

    while (tasks.length > 0) {

      const task = tasks.shift();

      statusEl.textContent =
        "선택한 영역 글자 인식 중...";

      const response = await ocrWorker.recognize(
        task.canvas
      );

      if (task.version !== imageVersion) {
        continue;
      }

      /*
        선택 영역 결과는 한 줄로 출력
      */

      const text = (response.data.text || "")
        .replace(/\s+/g, " ")
        .trim();

      if (text) {

        if (resultEl.value) {
          resultEl.value += "\n";
        }

        resultEl.value += text;

        resultEl.scrollTop =
          resultEl.scrollHeight;

      }

      statusEl.textContent =
        tasks.length > 0
          ? `인식 중... 대기 영역 ${tasks.length}개`
          : "인식 완료. 다음 영역을 드래그하세요.";

    }

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "OCR 오류: " + error.message;

    tasks.length = 0;

  } finally {

    processing = false;

  }

}


// 전체 복사
$("copy").addEventListener("click", async () => {

  if (!resultEl.value.trim()) {

    alert("복사할 내용이 없습니다.");
    return;

  }

  try {

    await navigator.clipboard.writeText(
      resultEl.value
    );

    statusEl.textContent = "전체 복사 완료!";

  } catch {

    resultEl.select();

    const success = document.execCommand("copy");

    statusEl.textContent = success
      ? "전체 복사 완료!"
      : "복사 실패";

  }

});


// 초기화
$("clear").addEventListener("click", () => {

  imageVersion++;

  tasks.length = 0;

  resultEl.value = "";
  fileInput.value = "";

  dragging = false;
  startPoint = null;

  clearSelection();

  imageCtx.clearRect(
    0,
    0,
    imageCanvas.width,
    imageCanvas.height
  );

  imageCanvas.width = 0;
  imageCanvas.height = 0;

  selectionCanvas.width = 0;
  selectionCanvas.height = 0;

  imageWrap.style.display = "none";

  statusEl.textContent =
    "초기화 완료. 이미지를 넣어주세요.";

});

</script>

</body>
</html>
