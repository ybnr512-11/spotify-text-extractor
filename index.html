<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 18px;
  background: #121212;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

main {
  max-width: 950px;
  margin: auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 10px;
}

p {
  color: #aaaaaa;
  line-height: 1.6;
}

.box {
  background: #202020;
  border-radius: 12px;
  padding: 22px;
  margin-top: 20px;
}

#drop {
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 35px 20px;
  text-align: center;
  cursor: pointer;
}

#drop:hover {
  background: #292929;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444444;
  color: white;
}

#result {
  width: 100%;
  height: 500px;
  padding: 16px;
  background: #151515;
  color: white;
  border: 1px solid #555555;
  border-radius: 8px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 250px;
  margin-top: 15px;
  border-radius: 8px;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
Spotify 화면을 캡처한 뒤 Ctrl + V로 붙여넣으세요.
</p>

<section class="box">

  <div id="drop">
    <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
    <p>또는 클릭해서 이미지 선택</p>

    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
      hidden
    >
  </div>

  <img id="preview" alt="이미지 미리보기">

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="추출된 텍스트가 여기에 표시됩니다."
  ></textarea>

</section>

</main>

<script>

const $ = id => document.getElementById(id);

let worker = null;
let working = false;
let generation = 0;

const queue = [];


// 파일 선택

$("drop").addEventListener("click", () => {
  $("file").click();
});

$("file").addEventListener("change", e => {

  addImages([...e.target.files]);

  e.target.value = "";

});


// Ctrl + V 붙여넣기

document.addEventListener("paste", e => {

  const files = [...(e.clipboardData?.items || [])]
    .filter(item => item.type.startsWith("image/"))
    .map(item => item.getAsFile())
    .filter(Boolean);

  if (files.length) {

    e.preventDefault();

    addImages(files);

  }

});


// 이미지 추가

function addImages(files) {

  const images = files.filter(file =>
    file && file.type.startsWith("image/")
  );

  if (!images.length) return;

  queue.push(...images);

  run();

}


// 이미지 확대
// 원본 비율과 색상을 유지합니다.

async function enlargeImage(file) {

  const bitmap = await createImageBitmap(file);

  try {

    const scale = 3;

    const canvas = document.createElement("canvas");

    canvas.width = bitmap.width * scale;
    canvas.height = bitmap.height * scale;

    const ctx = canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
      bitmap,
      0,
      0,
      canvas.width,
      canvas.height
    );

    return canvas;

  } finally {

    bitmap.close();

  }

}


// OCR 결과에서 텍스트만 가져오기

function extractText(response) {

  return (response.data.text || "")
    .replace(/\r\n/g, "\n")
    .trim();

}


// OCR 실행

async function run() {

  if (working) return;

  working = true;

  try {

    if (!worker) {

      $("status").textContent =
        "한국어·영어 OCR 엔진 준비 중...";

      worker = await Tesseract.createWorker(
        "kor+eng",
        1
      );

      await worker.setParameters({

        tessedit_pageseg_mode: "3",

        preserve_interword_spaces: "1"

      });

    }

    while (queue.length > 0) {

      const file = queue.shift();

      const currentGeneration = generation;

      const previewURL = URL.createObjectURL(file);

      $("preview").src = previewURL;
      $("preview").style.display = "block";

      try {

        $("status").textContent =
          "원본 이미지 글자 인식 중...";

        // 1. 원본 이미지 인식

        const originalResult =
          await worker.recognize(file);

        if (currentGeneration !== generation) {
          continue;
        }

        // 2. 확대 이미지 인식

        $("status").textContent =
          "확대 이미지 글자 인식 중...";

        const enlarged = await enlargeImage(file);

        const enlargedResult =
          await worker.recognize(enlarged);

        if (currentGeneration !== generation) {
          continue;
        }

        // 3. OCR 신뢰도 비교

        const originalConfidence =
          originalResult.data.confidence || 0;

        const enlargedConfidence =
          enlargedResult.data.confidence || 0;

        let bestResult;

        if (enlargedConfidence > originalConfidence) {

          bestResult = enlargedResult;

        } else {

          bestResult = originalResult;

        }

        // 4. 글자만 출력
        // 곡명/아티스트/앨범 분류하지 않음

        const text = extractText(bestResult);

        if (text) {

          if ($("result").value.trim()) {

            $("result").value += "\n\n";

          }

          $("result").value += text;

          $("result").scrollTop =
            $("result").scrollHeight;

        }

        $("status").textContent =
          "추출 완료! " +
          "남은 이미지: " +
          queue.length +
          "장";

      } finally {

        URL.revokeObjectURL(previewURL);

      }

    }

  } catch (error) {

    $("status").textContent =
      "오류: " + error.message;

    console.error(error);

  } finally {

    working = false;

    if (queue.length > 0) {

      run();

    }

  }

}


// 전체 복사

$("copy").addEventListener("click", async () => {

  const text = $("result").value;

  if (!text.trim()) {

    alert("복사할 내용이 없습니다.");

    return;

  }

  try {

    await navigator.clipboard.writeText(text);

    $("status").textContent =
      "전체 복사 완료!";

  } catch (error) {

    $("result").select();

    document.execCommand("copy");

    $("status").textContent =
      "전체 복사 완료!";

  }

});


// 초기화

$("clear").addEventListener("click", () => {

  generation++;

  queue.length = 0;

  $("result").value = "";

  $("preview").style.display = "none";

  $("status").textContent =
    "초기화 완료.";

});

</script>

</body>
</html>
