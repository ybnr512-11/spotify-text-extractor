<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 18px;
  background: #121212;
  color: #fff;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 8px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.box {
  background: #202020;
  border-radius: 12px;
  padding: 22px;
  margin-top: 20px;
}

#drop {
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 35px 20px;
  text-align: center;
  cursor: pointer;
}

#drop:hover {
  background: #292929;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: #fff;
}

#result {
  width: 100%;
  height: 460px;
  padding: 16px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #151515;
  color: #fff;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre;
  overflow: auto;
  resize: vertical;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 260px;
  margin-top: 15px;
  border-radius: 8px;
}

small {
  color: #999;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
Spotify 화면을 캡처한 뒤 Ctrl + V로 붙여넣으세요.<br>
한국어·영어 텍스트를 자동으로 인식합니다.
</p>

<section class="box">

  <div id="drop">
    <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
    <p>또는 클릭해서 이미지 선택</p>

    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
      hidden
    >
  </div>

  <img id="preview" alt="캡처 이미지">

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <p>
    <small>
      여러 장을 넣으면 결과가 아래로 계속 추가됩니다.
    </small>
  </p>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="추출된 텍스트가 여기에 표시됩니다."
  ></textarea>

</section>

</main>

<script>

const $ = id => document.getElementById(id);

let worker = null;
let working = false;
let generation = 0;

const queue = [];


// 이미지 업로드
$("drop").addEventListener("click", () => {
  $("file").click();
});

$("file").addEventListener("change", e => {
  addImages([...e.target.files]);
  e.target.value = "";
});


// Ctrl + V 붙여넣기
document.addEventListener("paste", e => {

  const files = [...(e.clipboardData?.items || [])]
    .filter(item => item.type.startsWith("image/"))
    .map(item => item.getAsFile())
    .filter(Boolean);

  if (files.length) {
    e.preventDefault();
    addImages(files);
  }

});


// 이미지 대기열
function addImages(files) {

  const images = files.filter(file =>
    file && file.type.startsWith("image/")
  );

  if (!images.length) return;

  queue.push(...images);

  run();

}


// 이미지 전처리
async function prepareImage(file) {

  const bitmap = await createImageBitmap(file);

  try {

    const W = bitmap.width;
    const H = bitmap.height;

    /*
      스포티파이 화면에서
      상단 플레이리스트 소개와
      하단 재생바를 제외합니다.

      사용자가 올린 전체 화면 캡처 기준입니다.
    */

    let cropX = 0;
    let cropY = 0;
    let cropW = W;
    let cropH = H;

    /*
      전체 화면 캡처처럼 세로가 긴 이미지일 때만
      상단/하단 불필요한 영역을 제외합니다.

      곡 목록만 캡처한 이미지는 자르지 않습니다.
    */

    if (H > W * 0.95) {

      cropY = Math.round(H * 0.26);
      cropH = Math.round(H * 0.70);

    }

    /*
      작은 글자를 3배 확대합니다.
    */

    const scale = 3;

    const canvas = document.createElement("canvas");

    canvas.width = cropW * scale;
    canvas.height = cropH * scale;

    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
      bitmap,
      cropX,
      cropY,
      cropW,
      cropH,
      0,
      0,
      canvas.width,
      canvas.height
    );

    /*
      Spotify의 어두운 배경과
      밝은 글자를 OCR에 적합하도록 변환합니다.

      어두운 배경 → 흰색
      밝은 글자 → 검은색

      글자를 새로 만들거나 추측하지 않습니다.
    */

    const imageData = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const pixels = imageData.data;

    for (let i = 0; i < pixels.length; i += 4) {

      const r = pixels[i];
      const g = pixels[i + 1];
      const b = pixels[i + 2];

      const brightness =
        0.299 * r +
        0.587 * g +
        0.114 * b;

      /*
        완전한 흑백으로 만들지 않고
        회색 계조를 일부 유지합니다.
      */

      let value;

      if (brightness < 55) {
        value = 255;
      } else if (brightness > 175) {
        value = 0;
      } else {
        value = Math.round(
          255 - (brightness - 55) * (255 / 120)
        );
      }

      pixels[i] = value;
      pixels[i + 1] = value;
      pixels[i + 2] = value;
      pixels[i + 3] = 255;

    }

    ctx.putImageData(imageData, 0, 0);

    return canvas;

  } finally {

    bitmap.close();

  }

}


// OCR 실행
async function run() {

  if (working) return;

  working = true;

  try {

    if (!worker) {

      $("status").textContent =
        "한국어 + 영어 OCR 엔진 준비 중...";

      worker = await Tesseract.createWorker("kor+eng");

      await worker.setParameters({

        /*
          자동 페이지 분석
          텍스트 영역을 OCR 엔진이 판단합니다.
        */

        tessedit_pageseg_mode: "3",

        /*
          단어 사이 공백 유지
        */

        preserve_interword_spaces: "1"

      });

    }

    while (queue.length > 0) {

      const file = queue.shift();
      const currentGeneration = generation;

      const url = URL.createObjectURL(file);

      $("preview").src = url;
      $("preview").style.display = "block";

      $("status").textContent =
        "이미지 전처리 중...";

      try {

        const prepared = await prepareImage(file);

        $("status").textContent =
          "글자 인식 중...";

        const response = await worker.recognize(prepared);

        if (currentGeneration !== generation) {
          continue;
        }

        /*
          곡명·아티스트·앨범 분류 없음
          좌표 재정렬 없음
          OCR 원본 결과만 출력
        */

        const text = (response.data.text || "").trim();

        if (text) {

          if ($("result").value.trim()) {
            $("result").value += "\n\n";
          }

          $("result").value += text;

          $("result").scrollTop =
            $("result").scrollHeight;

        }

        $("status").textContent =
          "인식 완료! 남은 이미지: " +
          queue.length + "장";

      } finally {

        URL.revokeObjectURL(url);

      }

    }

  } catch (error) {

    $("status").textContent =
      "오류: " + error.message;

  } finally {

    working = false;

    if (queue.length > 0) {
      run();
    }

  }

}


// 전체 복사
$("copy").addEventListener("click", async () => {

  const text = $("result").value;

  if (!text.trim()) {
    alert("복사할 내용이 없습니다.");
    return;
  }

  try {

    await navigator.clipboard.writeText(text);

    $("status").textContent = "전체 복사 완료!";

  } catch (error) {

    $("result").select();

    const success = document.execCommand("copy");

    $("status").textContent = success
      ? "전체 복사 완료!"
      : "복사에 실패했습니다.";

  }

});


// 초기화
$("clear").addEventListener("click", () => {

  generation++;

  queue.length = 0;

  $("result").value = "";

  $("preview").style.display = "none";

  $("status").textContent =
    "초기화 완료. 새 이미지를 넣어주세요.";

});

</script>

</body>
</html>
