<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 20px;
  background: #121212;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 10px;
}

p {
  color: #b3b3b3;
  line-height: 1.6;
}

.box {
  background: #202020;
  padding: 24px;
  border-radius: 12px;
  margin-top: 20px;
}

.upload {
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 35px 20px;
  text-align: center;
  cursor: pointer;
}

.upload:hover {
  background: #292929;
}

button {
  background: #1ed760;
  color: #111;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

textarea {
  width: 100%;
  height: 400px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  resize: vertical;
  font-size: 14px;
  line-height: 1.7;
}

#status {
  color: #1ed760;
  margin-top: 15px;
  white-space: pre-wrap;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 250px;
  margin-top: 15px;
  border-radius: 8px;
}

small {
  color: #999;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎵 Spotify 텍스트 추출기</h1>

  <p>
    Spotify 화면을 캡처해서 붙여넣으면
    한국어와 영어 텍스트를 추출합니다.
  </p>

  <div class="box">

    <div class="upload" id="uploadArea">
      <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
      <p>또는 클릭해서 이미지 선택</p>
      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        style="display:none"
      >
    </div>

    <img id="preview" alt="이미지 미리보기">

    <div id="status">이미지를 넣어주세요.</div>

  </div>

  <div class="box">

    <h2>추출 결과</h2>

    <button id="copyBtn">📋 전체 복사</button>
    <button id="clearBtn" class="secondary">초기화</button>

    <p>
      <small>
        여러 장을 붙여넣으면 기존 결과 아래에 계속 추가됩니다.
      </small>
    </p>

    <textarea
      id="result"
      placeholder="추출된 텍스트가 여기에 표시됩니다."
    ></textarea>

  </div>

</div>

<script>

const uploadArea = document.getElementById("uploadArea");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const copyBtn = document.getElementById("copyBtn");
const clearBtn = document.getElementById("clearBtn");

let worker = null;
let processing = false;
let queue = [];
let generation = 0;


// 파일 선택
uploadArea.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", e => {
  addImages([...e.target.files]);
  fileInput.value = "";
});


// Ctrl + V 이미지 붙여넣기
document.addEventListener("paste", e => {

  const files = [...(e.clipboardData?.items || [])]
    .filter(item => item.type.startsWith("image/"))
    .map(item => item.getAsFile())
    .filter(Boolean);

  if (files.length > 0) {
    e.preventDefault();
    addImages(files);
  }

});


// 이미지 대기열 추가
function addImages(files) {

  const images = files.filter(file =>
    file && file.type.startsWith("image/")
  );

  if (!images.length) return;

  queue.push(...images);

  processQueue();

}


// OCR 처리
async function processQueue() {

  if (processing) return;

  processing = true;

  try {

    if (!worker) {

      statusEl.textContent =
        "한국어 + 영어 OCR 엔진 준비 중...";

      worker = await Tesseract.createWorker("kor+eng");

    }

    while (queue.length > 0) {

      const file = queue.shift();
      const currentGeneration = generation;

      const imageUrl = URL.createObjectURL(file);

      preview.src = imageUrl;
      preview.style.display = "block";

      statusEl.textContent =
        "이미지 인식 중... 남은 이미지 " +
        queue.length + "장";

      try {

        const response = await worker.recognize(file);

        if (currentGeneration !== generation) {
          continue;
        }

        const text = (response.data.text || "").trim();

        if (text) {

          if (resultEl.value.trim()) {
            resultEl.value += "\n\n";
          }

          resultEl.value += text;

          resultEl.scrollTop = resultEl.scrollHeight;

        }

      } finally {

        URL.revokeObjectURL(imageUrl);

      }

    }

    statusEl.textContent = "인식 완료!";

  } catch (error) {

    statusEl.textContent =
      "오류 발생: " + error.message;

  } finally {

    processing = false;

    if (queue.length > 0) {
      processQueue();
    }

  }

}


// 전체 복사
copyBtn.addEventListener("click", async () => {

  if (!resultEl.value.trim()) {
    alert("복사할 텍스트가 없습니다.");
    return;
  }

  try {

    await navigator.clipboard.writeText(resultEl.value);

    statusEl.textContent =
      "복사 완료!";

  } catch (error) {

    resultEl.select();

    document.execCommand("copy");

    statusEl.textContent =
      "복사 완료!";

  }

});


// 초기화
clearBtn.addEventListener("click", () => {

  generation++;

  queue = [];

  resultEl.value = "";

  preview.style.display = "none";

  statusEl.textContent =
    "초기화 완료. 새 이미지를 넣어주세요.";

});

</script>

</body>
</html>
