<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

h1 { color: #1ed760; }

p {
  color: #aaa;
  line-height: 1.6;
}

.box {
  background: #202020;
  padding: 22px;
  border-radius: 12px;
  margin-top: 20px;
}

#drop {
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 30px 20px;
  text-align: center;
}

#drop.dragging {
  background: #303030;
}

#file {
  display: block;
  margin: 15px auto;
  max-width: 100%;
  color: white;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 250px;
  margin-top: 15px;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
}

#result {
  width: 100%;
  height: 500px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
Spotify 화면을 캡처한 뒤 Ctrl + V로 붙여넣거나
이미지 파일을 선택하세요.
</p>

<section class="box">

  <div id="drop">
    <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
    <p>또는 이미지 파일 선택</p>
    <input id="file" type="file" accept="image/*" multiple>
  </div>

  <img id="preview" alt="이미지 미리보기">

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="인식된 텍스트가 한 영역씩 한 줄로 표시됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");

const queue = [];

let worker = null;
let processing = false;
let generation = 0;
let previewURL = null;


// 파일 선택
fileInput.addEventListener("change", () => {
  addImages(Array.from(fileInput.files));
  fileInput.value = "";
});


// Ctrl + V 붙여넣기
document.addEventListener("paste", event => {

  const items = Array.from(
    event.clipboardData?.items || []
  );

  const images = items
    .filter(item => item.type.startsWith("image/"))
    .map(item => item.getAsFile())
    .filter(Boolean);

  if (images.length) {
    event.preventDefault();
    addImages(images);
  }

});


// 드래그 앤 드롭
drop.addEventListener("dragover", event => {
  event.preventDefault();
  drop.classList.add("dragging");
});

drop.addEventListener("dragleave", () => {
  drop.classList.remove("dragging");
});

drop.addEventListener("drop", event => {
  event.preventDefault();
  drop.classList.remove("dragging");

  addImages(Array.from(event.dataTransfer.files));
});


// 이미지 추가
function addImages(files) {

  const images = files.filter(file =>
    file && file.type.startsWith("image/")
  );

  if (!images.length) return;

  showPreview(images[0]);

  queue.push(...images);

  statusEl.textContent =
    `이미지 ${images.length}장 추가 완료`;

  processQueue();
}


// 미리보기
function showPreview(file) {

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
  }

  previewURL = URL.createObjectURL(file);

  preview.src = previewURL;
  preview.style.display = "block";
}


// OCR 결과에서 텍스트 영역별 추출
function extractRegions(data) {

  const blocks = data.blocks || [];

  const regions = [];

  /*
    Tesseract가 인식한 텍스트 줄을 사용한다.

    하나의 줄에서 단어 사이에 큰 간격이 있으면
    서로 다른 텍스트 영역으로 분리한다.

    예:
    Back To You        Things I Never Said

    출력:
    Back To You
    Things I Never Said
  */

  for (const block of blocks) {

    for (const paragraph of (block.paragraphs || [])) {

      for (const line of (paragraph.lines || [])) {

        const words = (line.words || [])
          .filter(word => word.text?.trim())
          .sort((a, b) =>
            a.bbox.x0 - b.bbox.x0
          );

        if (!words.length) continue;

        const heights = words.map(word =>
          Math.max(
            1,
            word.bbox.y1 - word.bbox.y0
          )
        );

        const averageHeight =
          heights.reduce((a, b) => a + b, 0) /
          heights.length;

        /*
          단어 사이 간격이 글자 높이의
          1.5배 이상이면 다른 영역으로 판단.
        */

        const gapLimit = averageHeight * 1.5;

        let current = [];
        let previous = null;

        for (const word of words) {

          if (previous) {

            const gap =
              word.bbox.x0 - previous.bbox.x1;

            if (gap > gapLimit) {

              if (current.length) {

                regions.push({
                  text: current
                    .map(w => w.text)
                    .join(" ")
                    .trim(),

                  x: current[0].bbox.x0,
                  y: Math.min(
                    ...current.map(w => w.bbox.y0)
                  )
                });

              }

              current = [];
            }

          }

          current.push(word);
          previous = word;
        }

        if (current.length) {

          regions.push({
            text: current
              .map(w => w.text)
              .join(" ")
              .trim(),

            x: current[0].bbox.x0,
            y: Math.min(
              ...current.map(w => w.bbox.y0)
            )
          });

        }

      }

    }

  }

  /*
    화면에서 위쪽 → 아래쪽 순서.
    같은 높이에서는 왼쪽 → 오른쪽 순서.
  */

  regions.sort((a, b) => {

    const rowDifference = a.y - b.y;

    if (Math.abs(rowDifference) < 10) {
      return a.x - b.x;
    }

    return rowDifference;

  });

  return regions
    .map(region => region.text)
    .filter(Boolean)
    .join("\n");
}


// OCR 실행
async function processQueue() {

  if (processing) return;

  processing = true;

  try {

    if (typeof Tesseract === "undefined") {
      throw new Error(
        "OCR 라이브러리를 불러오지 못했습니다."
      );
    }

    if (!worker) {

      statusEl.textContent =
        "한국어·영어 OCR 엔진 준비 중...";

      worker = await Tesseract.createWorker(
        "kor+eng",
        1
      );

      await worker.setParameters({

        /*
          자동 페이지 분석
        */
        tessedit_pageseg_mode: "3",

        /*
          불필요한 공백 생성 방지
        */
        preserve_interword_spaces: "0"

      });

    }

    while (queue.length) {

      const file = queue.shift();
      const currentGeneration = generation;

      showPreview(file);

      statusEl.textContent = "글자 인식 중...";

      /*
        원본 이미지 그대로 인식.
        자르기, 확대, 흑백 변환 없음.
        
        blocks 결과를 명시적으로 요청.
      */

      const response = await worker.recognize(
        file,
        {},
        {
          blocks: true,
          text: true
        }
      );

      if (currentGeneration !== generation) {
        continue;
      }

      let text = extractRegions(response.data);

      /*
        영역 정보가 없으면
        일반 OCR 텍스트 사용.
      */

      if (!text.trim()) {
        text = (response.data.text || "").trim();
      }

      if (text) {

        if (resultEl.value.trim()) {
          resultEl.value += "\n\n";
        }

        resultEl.value += text;

        resultEl.scrollTop =
          resultEl.scrollHeight;
      }

      statusEl.textContent =
        `인식 완료! 남은 이미지: ${queue.length}장`;

    }

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "OCR 오류: " + error.message;

    worker = null;
    queue.length = 0;

  } finally {

    processing = false;

  }

}


// 전체 복사
document.getElementById("copy")
  .addEventListener("click", async () => {

    const text = resultEl.value;

    if (!text.trim()) {
      alert("복사할 내용이 없습니다.");
      return;
    }

    try {

      await navigator.clipboard.writeText(text);

      statusEl.textContent = "전체 복사 완료!";

    } catch {

      resultEl.select();

      document.execCommand("copy");

      statusEl.textContent = "전체 복사 완료!";

    }

  });


// 초기화
document.getElementById("clear")
  .addEventListener("click", () => {

    generation++;

    queue.length = 0;

    resultEl.value = "";
    fileInput.value = "";

    preview.style.display = "none";
    preview.removeAttribute("src");

    if (previewURL) {
      URL.revokeObjectURL(previewURL);
      previewURL = null;
    }

    statusEl.textContent = "초기화 완료.";

  });

</script>

</body>
</html>
