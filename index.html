<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Text Extractor</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #121212;
  color: white;
  text-align: center;
  padding: 40px 15px;
}
.container {
  max-width: 750px;
  margin: auto;
}
h1 { color: #1DB954; }
.box {
  background: #242424;
  padding: 25px;
  border-radius: 12px;
  margin-top: 25px;
}
button {
  background: #1DB954;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin: 10px;
}
textarea {
  width: 95%;
  height: 300px;
  background: #181818;
  color: white;
  padding: 10px;
}
</style>
</head>
<body>
<div class="container">
<h1>🎵 Spotify Text Extractor</h1>
<p>스포티파이 화면을 텍스트로 변환하세요.</p>

<div class="box">
<h3>화면 캡처 업로드</h3>
<input type="file" id="images" accept="image/*" multiple>
<br>
<button onclick="extractText()">텍스트 추출하기</button>
<p id="status"></p>
</div>

<div class="box">
<h3>추출 결과</h3>
<textarea id="result"></textarea>
<br>
<button onclick="copyText()">전체 복사</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
async function extractText() {
  const files = document.getElementById("images").files;
  const result = document.getElementById("result");
  const status = document.getElementById("status");

  if (!files.length) {
    status.innerText = "이미지를 선택해 주세요.";
    return;
  }

  if (!window.Tesseract) {
    status.innerText = "OCR 라이브러리를 불러오지 못했습니다.";
    return;
  }

  let worker;
  try {
    status.innerText = "텍스트 인식 준비 중...";
    worker = await Tesseract.createWorker("eng+kor");

    let texts = [];
    for (let i = 0; i < files.length; i++) {
      status.innerText = `${i + 1}/${files.length} 인식 중...`;
      const data = await worker.recognize(files[i]);
      texts.push(data.data.text);
    }

    result.value = texts.join("\n");
    status.innerText = "추출 완료!";
  } catch (error) {
    status.innerText = "오류: " + error.message;
  } finally {
    if (worker) await worker.terminate();
  }
}

async function copyText() {
  const result = document.getElementById("result");
  try {
    await navigator.clipboard.writeText(result.value);
    alert("복사 완료!");
  } catch {
    result.select();
    alert("Ctrl+C를 눌러 복사해 주세요.");
  }
}
</script>
</body>
</html>
