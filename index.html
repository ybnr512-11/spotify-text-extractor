<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #121212;
  color: #fff;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1050px;
  margin: auto;
}

h1 { color: #1ed760; }

p {
  color: #bbb;
  line-height: 1.6;
}

.box {
  background: #202020;
  padding: 22px;
  margin-top: 18px;
  border-radius: 12px;
}

#drop {
  padding: 35px;
  border: 2px dashed #1ed760;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
}

#drop:hover { background: #292929; }

button {
  padding: 11px 17px;
  margin: 5px 5px 5px 0;
  background: #1ed760;
  color: #111;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

textarea {
  width: 100%;
  height: 450px;
  padding: 15px;
  background: #151515;
  color: #fff;
  border: 1px solid #555;
  border-radius: 8px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre;
  overflow: auto;
  resize: vertical;
}

#status {
  color: #1ed760;
  margin-top: 15px;
}

#preview {
  max-width: 100%;
  max-height: 240px;
  display: none;
  margin-top: 15px;
}

small { color: #999; }
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
Spotify 화면을 캡처한 뒤 Ctrl + V로 붙여넣으세요.<br>
한국어 + 영어 / 화면의 행과 열 구조를 최대한 유지합니다.
</p>

<section class="box">

<div id="drop">
  <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
  <p>또는 클릭해서 이미지 선택</p>
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>

<img id="preview" alt="이미지 미리보기">

<div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

<h2>추출 결과</h2>

<button id="copy">📋 전체 복사</button>
<button id="clear" class="secondary">초기화</button>

<p>
<small>
OCR 결과를 화면의 위치에 맞춰 정렬합니다.
텍스트를 직접 수정할 수도 있습니다.
</small>
</p>

<textarea id="result" spellcheck="false"
placeholder="추출된 텍스트가 여기에 표시됩니다."></textarea>

</section>

</main>

<script>

const $ = id => document.getElementById(id);

const queue = [];
let working = false;
let worker = null;
let version = 0;

$("drop").onclick = () => $("file").click();

$("file").onchange = e => {
  addFiles([...e.target.files]);
  e.target.value = "";
};

document.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.items || [])]
    .filter(item => item.type.startsWith("image/"))
    .map(item => item.getAsFile())
    .filter(Boolean);

  if (files.length) {
    e.preventDefault();
    addFiles(files);
  }
});

function addFiles(files) {
  queue.push(...files.filter(f => f?.type.startsWith("image/")));
  run();
}

function formatLines(data) {
  const lines = (data.lines || [])
    .filter(line => line.text?.trim())
    .map(line => ({
      text: line.text.trim().replace(/\s+/g, " "),
      x: line.bbox.x0,
      y: (line.bbox.y0 + line.bbox.y1) / 2,
      height: line.bbox.y1 - line.bbox.y0
    }));

  if (!lines.length) {
    return data.text || "";
  }

  // 비슷한 높이의 텍스트는 같은 행으로 정렬
  lines.sort((a, b) => a.y - b.y || a.x - b.x);

  const medianHeight = [...lines]
    .map(line => line.height)
    .sort((a, b) => a - b)[Math.floor(lines.length / 2)] || 16;

  const tolerance = Math.max(5, medianHeight * 0.55);
  const rows = [];

  for (const line of lines) {
    let row = rows.find(r => Math.abs(r.y - line.y) <= tolerance);

    if (!row) {
      row = { y: line.y, items: [] };
      rows.push(row);
    }

    row.items.push(line);
  }

  rows.sort((a, b) => a.y - b.y);

  // 글자 위치를 공백으로 표현
  const charWidth = Math.max(6, medianHeight * 0.55);

  return rows.map(row => {
    row.items.sort((a, b) => a.x - b.x);

    let output = "";
    let cursor = 0;

    for (const item of row.items) {
      const column = Math.max(0, Math.round(item.x / charWidth));
      const spaces = Math.max(1, column - cursor);

      output += " ".repeat(
        output ? Math.min(spaces, 60) : Math.min(column, 60)
      );

      output += item.text;
      cursor = column + item.text.length;
    }

    return output.trimEnd();
  }).join("\n");
}

async function run() {
  if (working) return;
  working = true;

  try {
    if (!worker) {
      $("status").textContent = "한국어 + 영어 OCR 준비 중...";
      worker = await Tesseract.createWorker("kor+eng");
      await worker.setParameters({
        preserve_interword_spaces: "1"
      });
    }

    while (queue.length) {
      const file = queue.shift();
      const currentVersion = version;

      const url = URL.createObjectURL(file);
      $("preview").src = url;
      $("preview").style.display = "block";

      $("status").textContent = "이미지 인식 중...";

      try {
        const response = await worker.recognize(file);

        if (currentVersion !== version) continue;

        const text = formatLines(response.data).trim();

        if (text) {
          $("result").value +=
            ($("result").value.trim() ? "\n\n" : "") + text;
        }

        $("status").textContent =
          "인식 완료! 남은 이미지: " + queue.length + "장";

      } finally {
        URL.revokeObjectURL(url);
      }
    }

  } catch (error) {
    $("status").textContent = "오류: " + error.message;
  } finally {
    working = false;
    if (queue.length) run();
  }
}

$("copy").onclick = async () => {
  if (!$("result").value.trim()) {
    alert("복사할 내용이 없습니다.");
    return;
  }

  try {
    await navigator.clipboard.writeText($("result").value);
    $("status").textContent = "복사 완료!";
  } catch {
    $("result").select();
    document.execCommand("copy");
    $("status").textContent = "복사 완료!";
  }
};

$("clear").onclick = () => {
  version++;
  queue.length = 0;
  $("result").value = "";
  $("preview").style.display = "none";
  $("status").textContent = "초기화 완료";
};

</script>

</body>
</html>
