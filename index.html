<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1200px;
  margin: auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 10px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.panel {
  background: #202020;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

button {
  padding: 11px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

#file {
  margin: 10px 0;
  color: white;
}

#imageContainer {
  position: relative;
  display: none;
  width: fit-content;
  max-width: 100%;
  margin-top: 15px;
  border: 1px solid #555;
  overflow: hidden;
  user-select: none;
}

#sourceImage {
  display: block;
  max-width: 100%;
  max-height: 75vh;
  width: auto;
  height: auto;
  pointer-events: none;
}

#selectionLayer {
  position: absolute;
  inset: 0;
  cursor: crosshair;
  touch-action: none;
}

#selection {
  position: absolute;
  display: none;
  border: 2px solid #1ed760;
  background: rgba(30, 215, 96, 0.16);
  pointer-events: none;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
}

#result {
  width: 100%;
  height: 300px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.8;
  resize: vertical;
}

#pasteArea {
  padding: 20px;
  border: 2px dashed #1ed760;
  border-radius: 10px;
  text-align: center;
  outline: none;
}

#pasteArea:focus {
  background: #292929;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
전체 화면을 캡처해서 붙여넣은 뒤,
추출할 글자 부분을 마우스로 드래그하세요.
</p>

<section class="panel">

  <div id="pasteArea" tabindex="0">
    📋 여기를 클릭하고 Ctrl + V로 이미지 붙여넣기
  </div>

  <input
    id="file"
    type="file"
    accept="image/*"
  >

  <div id="imageContainer">

    <img id="sourceImage" alt="캡처 이미지">

    <div id="selectionLayer">
      <div id="selection"></div>
    </div>

  </div>

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="panel">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="드래그한 영역의 텍스트가 한 줄씩 추가됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const fileInput = $("file");
const pasteArea = $("pasteArea");
const imageContainer = $("imageContainer");
const sourceImage = $("sourceImage");
const selectionLayer = $("selectionLayer");
const selection = $("selection");
const statusEl = $("status");
const resultEl = $("result");

let worker = null;
let workerPromise = null;

let imageURL = null;

let dragging = false;
let startX = 0;
let startY = 0;

let imageVersion = 0;
let pendingCount = 0;

const tasks = [];
let processing = false;


// 붙여넣기 영역 클릭
pasteArea.addEventListener("click", () => {
  pasteArea.focus();
});


// 파일 선택
fileInput.addEventListener("change", event => {

  const file = event.target.files[0];

  if (file) {
    loadImage(file);
  }

  fileInput.value = "";

});


// Ctrl + V 붙여넣기
document.addEventListener("paste", event => {

  const items = Array.from(
    event.clipboardData?.items || []
  );

  const item = items.find(
    item => item.type.startsWith("image/")
  );

  if (item) {

    const file = item.getAsFile();

    if (file) {
      event.preventDefault();
      loadImage(file);
    }

  }

});


// 이미지 드래그 앤 드롭
pasteArea.addEventListener("dragover", event => {
  event.preventDefault();
});

pasteArea.addEventListener("drop", event => {

  event.preventDefault();

  const file = Array.from(event.dataTransfer.files)
    .find(file => file.type.startsWith("image/"));

  if (file) {
    loadImage(file);
  }

});


// 이미지 불러오기
function loadImage(file) {

  imageVersion++;

  tasks.length = 0;
  pendingCount = 0;

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
  }

  imageURL = URL.createObjectURL(file);

  sourceImage.onload = () => {

    imageContainer.style.display = "block";

    statusEl.textContent =
      "이미지 준비 완료. 원하는 글자 영역을 드래그하세요.";

  };

  sourceImage.src = imageURL;

  selection.style.display = "none";

}


// 선택 영역 좌표
function getPosition(event) {

  const rect = selectionLayer.getBoundingClientRect();

  return {
    x: Math.max(
      0,
      Math.min(event.clientX - rect.left, rect.width)
    ),
    y: Math.max(
      0,
      Math.min(event.clientY - rect.top, rect.height)
    )
  };

}


// 드래그 시작
selectionLayer.addEventListener("pointerdown", event => {

  if (!sourceImage.complete || !sourceImage.naturalWidth) {
    return;
  }

  dragging = true;

  const pos = getPosition(event);

  startX = pos.x;
  startY = pos.y;

  selection.style.display = "block";

  selection.style.left = startX + "px";
  selection.style.top = startY + "px";
  selection.style.width = "0px";
  selection.style.height = "0px";

  selectionLayer.setPointerCapture(event.pointerId);

});


// 드래그 중
selectionLayer.addEventListener("pointermove", event => {

  if (!dragging) return;

  const pos = getPosition(event);

  const left = Math.min(startX, pos.x);
  const top = Math.min(startY, pos.y);

  const width = Math.abs(pos.x - startX);
  const height = Math.abs(pos.y - startY);

  selection.style.left = left + "px";
  selection.style.top = top + "px";
  selection.style.width = width + "px";
  selection.style.height = height + "px";

});


// 드래그 종료
selectionLayer.addEventListener("pointerup", event => {

  if (!dragging) return;

  dragging = false;

  const pos = getPosition(event);

  const left = Math.min(startX, pos.x);
  const top = Math.min(startY, pos.y);

  const width = Math.abs(pos.x - startX);
  const height = Math.abs(pos.y - startY);

  selection.style.display = "none";

  if (width < 5 || height < 5) {
    return;
  }

  recognizeSelection(left, top, width, height);

});


// OCR 엔진 준비
async function getWorker() {

  if (worker) return worker;

  if (workerPromise) return workerPromise;

  workerPromise = (async () => {

    if (typeof Tesseract === "undefined") {
      throw new Error("OCR 라이브러리를 불러오지 못했습니다.");
    }

    const newWorker = await Tesseract.createWorker("kor+eng");

    await newWorker.setParameters({

      /*
        선택한 영역을 하나의 텍스트 줄로 인식
      */

      tessedit_pageseg_mode: "7",

      preserve_interword_spaces: "0"

    });

    worker = newWorker;

    return worker;

  })();

  try {
    return await workerPromise;
  } catch (error) {
    workerPromise = null;
    throw error;
  }

}


// 선택 영역만 OCR 작업으로 등록
function recognizeSelection(left, top, width, height) {

  const displayedWidth = sourceImage.clientWidth;
  const displayedHeight = sourceImage.clientHeight;

  const scaleX =
    sourceImage.naturalWidth / displayedWidth;

  const scaleY =
    sourceImage.naturalHeight / displayedHeight;

  const cropX = Math.round(left * scaleX);
  const cropY = Math.round(top * scaleY);

  const cropWidth = Math.round(width * scaleX);
  const cropHeight = Math.round(height * scaleY);

  if (cropWidth < 2 || cropHeight < 2) return;

  const canvas = document.createElement("canvas");

  canvas.width = cropWidth;
  canvas.height = cropHeight;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    sourceImage,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    cropWidth,
    cropHeight
  );

  tasks.push({
    canvas,
    version: imageVersion
  });

  pendingCount++;

  statusEl.textContent =
    "선택한 영역을 인식 중...";

  processTasks();

}


// OCR 작업 처리
async function processTasks() {

  if (processing) return;

  processing = true;

  try {

    const ocrWorker = await getWorker();

    while (tasks.length) {

      const task = tasks.shift();

      const response = await ocrWorker.recognize(task.canvas);

      if (task.version !== imageVersion) {
        continue;
      }

      /*
        선택 영역 안의 줄바꿈과
        불필요한 연속 공백만 제거
      */

      const text = (response.data.text || "")
        .replace(/\s+/g, " ")
        .trim();

      if (text) {

        if (resultEl.value) {
          resultEl.value += "\n";
        }

        resultEl.value += text;

        resultEl.scrollTop = resultEl.scrollHeight;

      }

      pendingCount--;

      statusEl.textContent =
        pendingCount > 0
          ? `인식 중... 남은 영역 ${pendingCount}개`
          : "인식 완료. 다음 영역을 드래그하세요.";

    }

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "OCR 오류: " + error.message;

    tasks.length = 0;
    pendingCount = 0;

  } finally {

    processing = false;

  }

}


// 전체 복사
$("copy").addEventListener("click", async () => {

  const text = resultEl.value;

  if (!text.trim()) {
    alert("복사할 내용이 없습니다.");
    return;
  }

  try {

    await navigator.clipboard.writeText(text);

    statusEl.textContent = "전체 복사 완료!";

  } catch {

    resultEl.select();

    document.execCommand("copy");

    statusEl.textContent = "전체 복사 완료!";

  }

});


// 초기화
$("clear").addEventListener("click", () => {

  imageVersion++;

  tasks.length = 0;
  pendingCount = 0;

  resultEl.value = "";

  selection.style.display = "none";

  statusEl.textContent =
    "초기화 완료. 이미지를 넣어주세요.";

  imageContainer.style.display = "none";

  sourceImage.removeAttribute("src");

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
    imageURL = null;
  }

});

</script>

</body>
</html>
