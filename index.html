<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify 텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 18px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

h1 {
  color: #1ed760;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.box {
  background: #202020;
  padding: 22px;
  border-radius: 12px;
  margin-top: 20px;
}

#drop {
  display: block;
  border: 2px dashed #1ed760;
  border-radius: 10px;
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
}

#drop:hover {
  background: #292929;
}

#file {
  display: block;
  margin: 15px auto 0;
  max-width: 100%;
  color: white;
}

button {
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 250px;
  margin-top: 15px;
  border-radius: 8px;
}

#status {
  color: #1ed760;
  margin-top: 15px;
  white-space: pre-wrap;
}

#result {
  width: 100%;
  height: 450px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
Spotify 화면을 캡처한 뒤 Ctrl + V로 붙여넣거나
이미지 파일을 선택하세요.
</p>

<section class="box">

  <div id="drop">
    <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
    <p>또는 아래에서 이미지 파일 선택</p>

    <input
      id="file"
      type="file"
      accept="image/*"
      multiple
    >
  </div>

  <img id="preview" alt="이미지 미리보기">

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <p>여러 장을 넣으면 결과가 계속 추가됩니다.</p>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="추출된 텍스트가 여기에 표시됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const result = document.getElementById("result");
const copyButton = document.getElementById("copy");
const clearButton = document.getElementById("clear");

let worker = null;
let processing = false;
let generation = 0;
let previewURL = null;

const queue = [];

// 파일 선택
fileInput.addEventListener("change", function () {
  addImages(Array.from(fileInput.files));
  fileInput.value = "";
});

// Ctrl + V 이미지 붙여넣기
document.addEventListener("paste", function (event) {
  const clipboard = event.clipboardData;

  if (!clipboard) return;

  const images = [];

  for (const item of clipboard.items) {
    if (item.type.startsWith("image/")) {
      const file = item.getAsFile();

      if (file) {
        images.push(file);
      }
    }
  }

  if (images.length > 0) {
    event.preventDefault();
    addImages(images);
  }
});

// 이미지 드래그 앤 드롭
drop.addEventListener("dragover", function (event) {
  event.preventDefault();
});

drop.addEventListener("drop", function (event) {
  event.preventDefault();

  const files = Array.from(event.dataTransfer.files);
  addImages(files);
});

// 이미지 추가
function addImages(files) {
  const images = files.filter(function (file) {
    return file && file.type.startsWith("image/");
  });

  if (images.length === 0) {
    status.textContent = "이미지 파일을 선택해주세요.";
    return;
  }

  // OCR 실행 전에 미리보기부터 표시
  showPreview(images[0]);

  queue.push(...images);

  status.textContent =
    "이미지 " + images.length + "장 추가 완료. 인식 준비 중...";

  processQueue();
}

// 이미지 미리보기
function showPreview(file) {
  if (previewURL) {
    URL.revokeObjectURL(previewURL);
  }

  previewURL = URL.createObjectURL(file);
  preview.src = previewURL;
  preview.style.display = "block";
}

// OCR 엔진 준비
async function getWorker() {
  if (worker) return worker;

  if (typeof Tesseract === "undefined") {
    throw new Error(
      "OCR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요."
    );
  }

  status.textContent = "한국어·영어 OCR 엔진 준비 중...";

  worker = await Tesseract.createWorker("kor+eng");

  await worker.setParameters({
    tessedit_pageseg_mode: "3",
    preserve_interword_spaces: "1"
  });

  return worker;
}

// 이미지 OCR
async function processQueue() {
  if (processing) return;

  processing = true;

  try {
    const ocrWorker = await getWorker();

    while (queue.length > 0) {
      const file = queue.shift();
      const currentGeneration = generation;

      showPreview(file);

      status.textContent =
        "글자 인식 중... 남은 이미지: " +
        (queue.length + 1) + "장";

      // 원본 이미지를 그대로 인식
      const response = await ocrWorker.recognize(file);

      // 인식 도중 초기화했다면 결과를 추가하지 않음
      if (currentGeneration !== generation) {
        continue;
      }

      const text = (response.data.text || "").trim();

      if (text) {
        if (result.value.trim()) {
          result.value += "\n\n";
        }

        result.value += text;
        result.scrollTop = result.scrollHeight;
      }

      status.textContent =
        "인식 완료! 남은 이미지: " +
        queue.length + "장";
    }

  } catch (error) {
    console.error(error);

    status.textContent =
      "OCR 오류: " + error.message;

    // 오류가 발생하면 새 이미지로 재시도할 수 있도록 처리
    worker = null;
    queue.length = 0;

  } finally {
    processing = false;
  }
}

// 전체 복사
copyButton.addEventListener("click", async function () {
  if (!result.value.trim()) {
    alert("복사할 내용이 없습니다.");
    return;
  }

  try {
    await navigator.clipboard.writeText(result.value);
    status.textContent = "전체 복사 완료!";
  } catch (error) {
    result.select();

    const success = document.execCommand("copy");

    status.textContent = success
      ? "전체 복사 완료!"
      : "복사에 실패했습니다.";
  }
});

// 초기화
clearButton.addEventListener("click", function () {
  generation++;
  queue.length = 0;

  result.value = "";
  fileInput.value = "";

  preview.style.display = "none";
  preview.removeAttribute("src");

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }

  status.textContent = "초기화 완료.";
});
</script>

</body>
</html>
