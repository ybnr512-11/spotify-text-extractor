<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Text Extractor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 35px 16px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1 {
  color: #1DB954;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #b3b3b3;
  line-height: 1.7;
}

.box {
  background: #242424;
  padding: 25px;
  border-radius: 14px;
  margin-top: 22px;
}

.paste-area {
  border: 2px dashed #1DB954;
  border-radius: 12px;
  padding: 45px 15px;
  text-align: center;
  cursor: pointer;
  background: #191919;
}

.paste-area:focus {
  outline: 2px solid #1DB954;
}

.paste-area h2 {
  color: #1DB954;
}

.paste-area p {
  color: #b3b3b3;
}

button {
  background: #1DB954;
  color: #000;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin: 6px;
}

button:hover {
  background: #1ed760;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.secondary {
  background: #444;
  color: white;
}

.secondary:hover {
  background: #555;
}

textarea {
  width: 100%;
  height: 330px;
  background: #181818;
  color: white;
  padding: 15px;
  border: 1px solid #444;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.7;
  resize: vertical;
}

#status {
  color: #1DB954;
  text-align: center;
  min-height: 24px;
}

#preview {
  max-width: 100%;
  max-height: 230px;
  margin-top: 15px;
  border-radius: 8px;
  display: none;
}

.actions {
  text-align: center;
  margin-top: 15px;
}

.count {
  color: #b3b3b3;
  font-size: 13px;
}

input[type="file"] {
  margin-top: 15px;
  max-width: 100%;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎵 Spotify Text Extractor</h1>

  <p class="subtitle">
    스포티파이 화면을 캡처하고 Ctrl + V로 붙여넣으세요.<br>
    이미지 속 텍스트를 자동으로 추출합니다.
  </p>

  <div class="box">

    <div
      class="paste-area"
      id="pasteArea"
      tabindex="0"
    >
      <h2>📋 Ctrl + V</h2>
      <p>캡처한 이미지를 여기에 붙여넣으세요.</p>
      <p>Windows + Shift + S → Ctrl + V</p>
    </div>

    <div style="text-align:center">

      <input
        type="file"
        id="imageUpload"
        accept="image/*"
        multiple
      >

      <br>

      <img id="preview" alt="캡처 이미지 미리보기">

    </div>

    <p id="status">이미지를 기다리는 중...</p>

  </div>

  <div class="box">

    <h2>🎶 추출된 텍스트</h2>

    <p class="count" id="count">
      처리한 이미지: 0장
    </p>

    <textarea
      id="result"
      placeholder="추출된 곡명과 아티스트명이 여기에 표시됩니다."
    ></textarea>

    <div class="actions">

      <button id="copyButton" onclick="copyText()">
        📋 전체 복사
      </button>

      <button class="secondary" onclick="clearText()">
        🗑 초기화
      </button>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const result = document.getElementById("result");
const statusText = document.getElementById("status");
const preview = document.getElementById("preview");
const pasteArea = document.getElementById("pasteArea");
const imageUpload = document.getElementById("imageUpload");
const countText = document.getElementById("count");

let imageCount = 0;
let worker = null;
let processing = false;
let queue = [];


// Ctrl + V 이미지 붙여넣기
document.addEventListener("paste", function(event) {

  const items = event.clipboardData?.items;

  if (!items) return;

  const images = [];

  for (const item of items) {

    if (item.type.startsWith("image/")) {

      const file = item.getAsFile();

      if (file) {
        images.push(file);
      }

    }

  }

  if (images.length > 0) {

    event.preventDefault();

    addImages(images);

  }

});


// 이미지 파일 업로드
imageUpload.addEventListener("change", function(event) {

  const files = Array.from(event.target.files);

  addImages(files);

  event.target.value = "";

});


// 이미지 처리 대기열
function addImages(files) {

  for (const file of files) {

    if (file.type.startsWith("image/")) {
      queue.push(file);
    }

  }

  processQueue();

}


// OCR 자동 실행
async function processQueue() {

  if (processing) return;

  processing = true;

  try {

    if (!window.Tesseract) {
      throw new Error("OCR 라이브러리를 불러오지 못했습니다.");
    }

    if (!worker) {

      statusText.textContent = "OCR 준비 중...";

      worker = await Tesseract.createWorker("eng+kor");

    }

    while (queue.length > 0) {

      const file = queue.shift();

      statusText.textContent = "이미지 텍스트 인식 중...";

      // 미리보기
      const imageURL = URL.createObjectURL(file);

      preview.src = imageURL;
      preview.style.display = "inline-block";

      preview.onload = function() {
        URL.revokeObjectURL(imageURL);
      };

      // OCR 실행
      const response = await worker.recognize(file);

      const extractedText = response.data.text.trim();

      if (extractedText) {

        if (result.value.trim()) {
          result.value += "\n\n";
        }

        result.value += extractedText;

      }

      imageCount++;

      countText.textContent =
        "처리한 이미지: " + imageCount + "장";

      statusText.textContent =
        "✅ " + imageCount + "장 인식 완료";

    }

  } catch (error) {

    statusText.textContent =
      "오류 발생: " + error.message;

  } finally {

    processing = false;

  }

}


// 전체 복사
async function copyText() {

  if (!result.value.trim()) {

    alert("복사할 텍스트가 없습니다.");

    return;

  }

  try {

    await navigator.clipboard.writeText(result.value);

    alert("전체 텍스트 복사 완료!");

  } catch (error) {

    result.focus();
    result.select();

    alert("Ctrl + C를 눌러 복사해 주세요.");

  }

}


// 초기화
function clearText() {

  result.value = "";

  imageCount = 0;

  queue = [];

  countText.textContent = "처리한 이미지: 0장";

  statusText.textContent = "이미지를 기다리는 중...";

  preview.style.display = "none";

  preview.removeAttribute("src");

}


// 페이지 종료 시 OCR 정리
window.addEventListener("pagehide", function() {

  if (worker) {
    worker.terminate();
  }

});

</script>

</body>
</html>
