<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>텍스트 추출기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 1200px;
  margin: auto;
}

h1 {
  color: #1ed760;
  margin-bottom: 10px;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.panel {
  background: #202020;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

button {
  padding: 11px 18px;
  margin: 5px 5px 5px 0;
  border: none;
  border-radius: 8px;
  background: #1ed760;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#file {
  margin: 10px 0;
  color: white;
}

#imageContainer {
  position: relative;
  display: none;
  width: fit-content;
  max-width: 100%;
  margin-top: 15px;
  border: 1px solid #555;
  overflow: hidden;
  user-select: none;
}

#sourceImage {
  display: block;
  max-width: 100%;
  max-height: 75vh;
  width: auto;
  height: auto;
  pointer-events: none;
}

#selectionLayer {
  position: absolute;
  inset: 0;
  cursor: crosshair;
  touch-action: none;
}

#selection {
  position: absolute;
  display: none;
  border: 2px solid #1ed760;
  background: rgba(30, 215, 96, 0.16);
  pointer-events: none;
}

#status {
  margin-top: 15px;
  color: #1ed760;
  white-space: pre-wrap;
}

#result {
  width: 100%;
  height: 300px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1.8;
  resize: vertical;
}

#pasteArea {
  padding: 20px;
  border: 2px dashed #1ed760;
  border-radius: 10px;
  text-align: center;
  outline: none;
}

#pasteArea:focus {
  background: #292929;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
전체 화면을 캡처해서 붙여넣은 뒤,
추출할 글자 부분을 마우스로 드래그하세요.
영어·한국어·일본어·스페인어·포르투갈어를 자동으로 인식합니다.
</p>

<section class="panel">

  <div id="pasteArea" tabindex="0">
    📋 여기를 클릭하고 Ctrl + V로 이미지 붙여넣기
  </div>

  <input
    id="file"
    type="file"
    accept="image/*"
  >

  <div id="imageContainer">

    <img id="sourceImage" alt="캡처 이미지">

    <div id="selectionLayer">
      <div id="selection"></div>
    </div>

  </div>

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="panel">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="드래그한 영역의 텍스트가 표시됩니다."
  ></textarea>

</section>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const fileInput = $("file");
const pasteArea = $("pasteArea");

const imageContainer = $("imageContainer");
const sourceImage = $("sourceImage");

const selectionLayer = $("selectionLayer");
const selection = $("selection");

const statusEl = $("status");
const resultEl = $("result");

let imageURL = null;

let dragging = false;
let startX = 0;
let startY = 0;

let imageVersion = 0;
let selectionVersion = 0;

const tasks = [];
let processing = false;

// 언어별 OCR 엔진 보관
const workers = new Map();
const workerPromises = new Map();


// 붙여넣기 영역 클릭
pasteArea.addEventListener("click", () => {
  pasteArea.focus();
});


// 파일 선택
fileInput.addEventListener("change", event => {

  const file = event.target.files[0];

  if (file) {
    loadImage(file);
  }

  fileInput.value = "";

});


// Ctrl + V 붙여넣기
document.addEventListener("paste", event => {

  const items = Array.from(
    event.clipboardData?.items || []
  );

  const item = items.find(
    item => item.type.startsWith("image/")
  );

  if (item) {

    const file = item.getAsFile();

    if (file) {
      event.preventDefault();
      loadImage(file);
    }

  }

});


// 이미지 드래그 앤 드롭
pasteArea.addEventListener("dragover", event => {
  event.preventDefault();
});

pasteArea.addEventListener("drop", event => {

  event.preventDefault();

  const file = Array.from(event.dataTransfer.files)
    .find(file => file.type.startsWith("image/"));

  if (file) {
    loadImage(file);
  }

});


// 이미지 불러오기
function loadImage(file) {

  imageVersion++;
  selectionVersion++;

  tasks.length = 0;
  resultEl.value = "";

  dragging = false;
  selection.style.display = "none";

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
  }

  imageURL = URL.createObjectURL(file);

  sourceImage.onload = () => {

    imageContainer.style.display = "block";

    statusEl.textContent =
      "이미지 준비 완료. 원하는 글자 영역을 드래그하세요.";

  };

  sourceImage.src = imageURL;

}


// 선택 영역 좌표
function getPosition(event) {

  const rect = selectionLayer.getBoundingClientRect();

  return {
    x: Math.max(
      0,
      Math.min(event.clientX - rect.left, rect.width)
    ),
    y: Math.max(
      0,
      Math.min(event.clientY - rect.top, rect.height)
    )
  };

}


// 드래그 시작
selectionLayer.addEventListener("pointerdown", event => {

  if (!sourceImage.complete || !sourceImage.naturalWidth) {
    return;
  }

  event.preventDefault();

  dragging = true;

  const pos = getPosition(event);

  startX = pos.x;
  startY = pos.y;

  selection.style.display = "block";

  selection.style.left = startX + "px";
  selection.style.top = startY + "px";
  selection.style.width = "0px";
  selection.style.height = "0px";

  selectionLayer.setPointerCapture(event.pointerId);

});


// 드래그 중
selectionLayer.addEventListener("pointermove", event => {

  if (!dragging) return;

  event.preventDefault();

  const pos = getPosition(event);

  const left = Math.min(startX, pos.x);
  const top = Math.min(startY, pos.y);

  const width = Math.abs(pos.x - startX);
  const height = Math.abs(pos.y - startY);

  selection.style.left = left + "px";
  selection.style.top = top + "px";
  selection.style.width = width + "px";
  selection.style.height = height + "px";

});


// 드래그 종료
selectionLayer.addEventListener("pointerup", event => {

  if (!dragging) return;

  event.preventDefault();

  dragging = false;

  const pos = getPosition(event);

  const left = Math.min(startX, pos.x);
  const top = Math.min(startY, pos.y);

  const width = Math.abs(pos.x - startX);
  const height = Math.abs(pos.y - startY);

  selection.style.display = "none";

  if (width < 5 || height < 5) {
    return;
  }

  // 새 드래그 시 이전 추출 결과 초기화
  resultEl.value = "";

  // 이전 OCR 작업 결과 무효화
  selectionVersion++;
  tasks.length = 0;

  recognizeSelection(left, top, width, height);

});


// 드래그 취소
selectionLayer.addEventListener("pointercancel", () => {

  dragging = false;
  selection.style.display = "none";

});


// 언어별 OCR 엔진 준비
async function getWorker(language) {

  if (workers.has(language)) {
    return workers.get(language);
  }

  if (workerPromises.has(language)) {
    return workerPromises.get(language);
  }

  const promise = (async () => {

    if (typeof Tesseract === "undefined") {
      throw new Error(
        "OCR 라이브러리를 불러오지 못했습니다."
      );
    }

    const newWorker = await Tesseract.createWorker(
      language
    );

    // 기존 OCR 설정 유지
    await newWorker.setParameters({

      tessedit_pageseg_mode: "7",

      preserve_interword_spaces: "0"

    });

    workers.set(language, newWorker);

    return newWorker;

  })();

  workerPromises.set(language, promise);

  try {

    return await promise;

  } finally {

    workerPromises.delete(language);

  }

}


// 선택 영역만 OCR 작업으로 등록
function recognizeSelection(left, top, width, height) {

  const displayedWidth = sourceImage.clientWidth;
  const displayedHeight = sourceImage.clientHeight;

  const scaleX =
    sourceImage.naturalWidth / displayedWidth;

  const scaleY =
    sourceImage.naturalHeight / displayedHeight;

  const cropX = Math.round(left * scaleX);
  const cropY = Math.round(top * scaleY);

  const cropWidth = Math.round(width * scaleX);
  const cropHeight = Math.round(height * scaleY);

  if (cropWidth < 2 || cropHeight < 2) {
    return;
  }

  const canvas = document.createElement("canvas");

  canvas.width = cropWidth;
  canvas.height = cropHeight;

  const ctx = canvas.getContext("2d");

  // 기존 이미지 자르기 방식 유지
  ctx.drawImage(
    sourceImage,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    cropWidth,
    cropHeight
  );

  addTask(canvas);

}


// OCR 작업 추가
function addTask(canvas) {

  tasks.push({
    canvas,
    version: imageVersion,
    selection: selectionVersion
  });

  statusEl.textContent =
    "선택한 영역을 자동 인식 중...";

  processTasks();

}


// 인식 결과를 한 줄로 정리
function normalizeText(text) {

  return (text || "")
    .replace(/\s+/g, " ")
    .trim();

}


// 모든 언어의 문자 인정
function isMostlySymbols(text) {

  const letters = (
    text.match(/[\p{L}\p{N}]/gu) || []
  ).length;

  const visible = Array.from(
    text.replace(/\s/g, "")
  ).length;

  if (!visible) {
    return true;
  }

  return letters / visible < 0.6;

}


// 결과 정리
function validateResult(response) {

  const text = normalizeText(
    response.data.text
  );

  const confidence = Number(
    response.data.confidence
  );

  return {
    text,
    confidence
  };

}


// 일본어 문자가 실제로 있는지 확인
function hasJapanese(text) {

  return /[\u3040-\u30ff\u3400-\u9fff]/u.test(text);

}


// 스페인어·포르투갈어 특수 문자 확인
function hasLatinAccent(text) {

  return /[áéíóúüñãõâêôàçÁÉÍÓÚÜÑÃÕÂÊÔÀÇ]/u.test(text);

}


// OCR 후보 점수 계산
function scoreCandidate(candidate, language) {

  if (!candidate.text) {
    return -1000;
  }

  let score = Number.isFinite(candidate.confidence)
    ? candidate.confidence
    : 0;

  if (isMostlySymbols(candidate.text)) {
    score -= 50;
  }

  if (
    language === "jpn+eng" &&
    hasJapanese(candidate.text)
  ) {
    score += 15;
  }

  if (
    language === "spa+por+eng" &&
    hasLatinAccent(candidate.text)
  ) {
    score += 10;
  }

  return score;

}


// 자동 언어 인식
async function recognizeAutomatically(canvas, version, selectionId) {

  const candidates = [];

  // 1차: 기존 한국어 + 영어 OCR
  const defaultWorker = await getWorker(
    "kor+eng"
  );

  if (
    version !== imageVersion ||
    selectionId !== selectionVersion
  ) {
    return null;
  }

  const defaultResponse = await defaultWorker.recognize(
    canvas
  );

  if (
    version !== imageVersion ||
    selectionId !== selectionVersion
  ) {
    return null;
  }

  const defaultCandidate = validateResult(
    defaultResponse
  );

  candidates.push({
    ...defaultCandidate,
    language: "kor+eng"
  });

  // 기존 결과의 신뢰도가 높으면 그대로 사용
  // 신뢰도는 내부 언어 비교에만 사용하며 화면에 표시하지 않음
  if (
    defaultCandidate.text &&
    !isMostlySymbols(defaultCandidate.text) &&
    defaultCandidate.confidence >= 85
  ) {

    return defaultCandidate;

  }

  // 2차: 일본어 + 영어
  statusEl.textContent =
    "일본어 포함 여부 확인 중...";

  const japaneseWorker = await getWorker(
    "jpn+eng"
  );

  if (
    version !== imageVersion ||
    selectionId !== selectionVersion
  ) {
    return null;
  }

  const japaneseResponse = await japaneseWorker.recognize(
    canvas
  );

  if (
    version !== imageVersion ||
    selectionId !== selectionVersion
  ) {
    return null;
  }

  candidates.push({
    ...validateResult(japaneseResponse),
    language: "jpn+eng"
  });

  // 3차: 스페인어 + 포르투갈어 + 영어
  statusEl.textContent =
    "라틴 음악 언어 확인 중...";

  const latinWorker = await getWorker(
    "spa+por+eng"
  );

  if (
    version !== imageVersion ||
    selectionId !== selectionVersion
  ) {
    return null;
  }

  const latinResponse = await latinWorker.recognize(
    canvas
  );

  if (
    version !== imageVersion ||
    selectionId !== selectionVersion
  ) {
    return null;
  }

  candidates.push({
    ...validateResult(latinResponse),
    language: "spa+por+eng"
  });

  // 가장 적합한 결과 선택
  candidates.sort((a, b) => {

    return (
      scoreCandidate(b, b.language) -
      scoreCandidate(a, a.language)
    );

  });

  return candidates[0];

}


// 결과 표시
function showResult(text) {

  // 이전 결과를 누적하지 않고 교체
  resultEl.value = normalizeText(text);

  resultEl.scrollTop = 0;

}


// OCR 작업 처리
async function processTasks() {

  if (processing) return;

  processing = true;

  try {

    while (tasks.length) {

      const task = tasks.shift();

      if (
        task.version !== imageVersion ||
        task.selection !== selectionVersion
      ) {
        continue;
      }

      statusEl.textContent =
        "선택한 영역 글자 자동 인식 중...";

      const validation = await recognizeAutomatically(
        task.canvas,
        task.version,
        task.selection
      );

      if (
        task.version !== imageVersion ||
        task.selection !== selectionVersion ||
        !validation
      ) {
        continue;
      }

      // 신뢰도와 관계없이 인식 결과를 바로 표시
      showResult(validation.text);

      statusEl.textContent = validation.text
        ? "인식 완료. 다음 영역을 드래그하세요."
        : "글자가 인식되지 않았습니다. 다른 영역을 드래그해보세요.";

    }

  } catch (error) {

    console.error(error);

    statusEl.textContent =
      "OCR 오류: " + error.message;

    tasks.length = 0;

  } finally {

    processing = false;

    if (tasks.length) {
      processTasks();
    }

  }

}


// 전체 복사
$("copy").addEventListener("click", async () => {

  const text = resultEl.value;

  if (!text.trim()) {

    alert("복사할 내용이 없습니다.");
    return;

  }

  try {

    await navigator.clipboard.writeText(text);

    statusEl.textContent =
      "전체 복사 완료!";

  } catch {

    resultEl.select();

    document.execCommand("copy");

    statusEl.textContent =
      "전체 복사 완료!";

  }

});


// 초기화
$("clear").addEventListener("click", () => {

  imageVersion++;
  selectionVersion++;

  tasks.length = 0;

  resultEl.value = "";

  dragging = false;

  selection.style.display = "none";

  statusEl.textContent =
    "초기화 완료. 이미지를 넣어주세요.";

  imageContainer.style.display = "none";

  sourceImage.removeAttribute("src");

  if (imageURL) {

    URL.revokeObjectURL(imageURL);
    imageURL = null;

  }

});

</script>

</body>
</html>
