<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spotify 텍스트 추출기</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 18px;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
}

h1 {
  color: #1ed760;
}

p {
  color: #aaa;
  line-height: 1.6;
}

.box {
  background: #202020;
  padding: 22px;
  border-radius: 12px;
  margin-top: 20px;
}

#drop {
  padding: 35px 20px;
  border: 2px dashed #1ed760;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
}

#drop:hover {
  background: #292929;
}

button {
  background: #1ed760;
  color: #111;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  margin: 5px 5px 5px 0;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #444;
  color: white;
}

#status {
  color: #1ed760;
  margin-top: 15px;
  white-space: pre-wrap;
}

#result {
  width: 100%;
  height: 450px;
  padding: 15px;
  background: #151515;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.8;
  resize: vertical;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 220px;
  margin-top: 15px;
}

small {
  color: #999;
}
</style>
</head>

<body>

<main>

<h1>🎵 Spotify 텍스트 추출기</h1>

<p>
Spotify 화면을 캡처해서 Ctrl + V로 붙여넣으세요.<br>
한국어·영어 텍스트를 추출합니다.
</p>

<section class="box">

  <div id="drop">
    <h3>📋 Ctrl + V로 이미지 붙여넣기</h3>
    <p>또는 클릭해서 이미지 선택</p>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>

  <img id="preview" alt="캡처 미리보기">

  <div id="status">이미지를 넣어주세요.</div>

</section>

<section class="box">

  <h2>추출 결과</h2>

  <button id="copy">📋 전체 복사</button>
  <button id="clear" class="secondary">초기화</button>

  <p>
    <small>
      여러 장을 붙여넣으면 결과가 계속 추가됩니다.
    </small>
  </p>

  <textarea
    id="result"
    readonly
    spellcheck="false"
    placeholder="추출된 텍스트가 여기에 표시됩니다."
  ></textarea>

</section>

</main>

<script type="module">

import { PaddleOCR } from
  "https://esm.sh/@paddleocr/paddleocr-js?bundle";

const $ = id => document.getElementById(id);

let ocr = null;
let working = false;
let generation = 0;

const queue = [];


// 파일 선택
$("drop").addEventListener("click", () => {
  $("file").click();
});

$("file").addEventListener("change", e => {
  addImages([...e.target.files]);
  e.target.value = "";
});


// 이미지 붙여넣기
document.addEventListener("paste", e => {

  const files = [...(e.clipboardData?.items || [])]
    .filter(item => item.type.startsWith("image/"))
    .map(item => item.getAsFile())
    .filter(Boolean);

  if (files.length) {
    e.preventDefault();
    addImages(files);
  }

});


// 이미지 추가
function addImages(files) {

  const images = files.filter(
    file => file && file.type.startsWith("image/")
  );

  if (!images.length) return;

  queue.push(...images);

  run();

}


// 이미지 확대
async function prepareImage(file) {

  const bitmap = await createImageBitmap(file);

  try {

    const scale = 2;

    const canvas = document.createElement("canvas");

    canvas.width = bitmap.width * scale;
    canvas.height = bitmap.height * scale;

    const ctx = canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
      bitmap,
      0,
      0,
      canvas.width,
      canvas.height
    );

    /*
      원본 이미지 색상은 유지합니다.
      강제 흑백 변환이나 글자 제거는 하지 않습니다.
    */

    return canvas;

  } finally {
    bitmap.close();
  }

}


// OCR 결과 정리
function getText(result) {

  const items = result.items || [];

  /*
    텍스트의 위치를 이용해 읽는 순서만 정합니다.
    곡명/아티스트/앨범 분류는 하지 않습니다.
  */

  const lines = items.map(item => {

    const points = item.poly || [];

    const ys = points.map(point =>
      Array.isArray(point) ? point[1] : point.y
    );

    const xs = points.map(point =>
      Array.isArray(point) ? point[0] : point.x
    );

    return {
      text: (item.text || "").trim(),
      x: xs.length ? Math.min(...xs) : 0,
      y: ys.length ? Math.min(...ys) : 0
    };

  }).filter(item => item.text);

  lines.sort((a, b) => {
    return a.y - b.y || a.x - b.x;
  });

  return lines.map(line => line.text).join("\n");

}


// OCR 실행
async function run() {

  if (working) return;

  working = true;

  try {

    if (!ocr) {

      $("status").textContent =
        "새 OCR 엔진을 불러오는 중입니다.\n" +
        "처음 실행할 때는 모델 다운로드로 시간이 걸릴 수 있습니다.";

      ocr = await PaddleOCR.create({
        lang: "korean",
        ocrVersion: "PP-OCRv5",
        ortOptions: {
          backend: "wasm",
          numThreads: 1
        }
      });

    }

    while (queue.length) {

      const file = queue.shift();
      const currentGeneration = generation;

      const url = URL.createObjectURL(file);

      $("preview").src = url;
      $("preview").style.display = "block";

      try {

        $("status").textContent =
          "이미지 분석 중...";

        const canvas = await prepareImage(file);

        $("status").textContent =
          "텍스트 인식 중...";

        const results = await ocr.predict(canvas);

        if (currentGeneration !== generation) {
          continue;
        }

        const result = results[0];

        const text = getText(result);

        if (text) {

          if ($("result").value.trim()) {
            $("result").value += "\n\n";
          }

          $("result").value += text;

          $("result").scrollTop =
            $("result").scrollHeight;

        }

        $("status").textContent =
          "인식 완료! 남은 이미지: " +
          queue.length + "장";

      } finally {

        URL.revokeObjectURL(url);

      }

    }

  } catch (error) {

    $("status").textContent =
      "OCR 실행 오류: " + error.message;

    console.error(error);

  } finally {

    working = false;

    if (queue.length) {
      run();
    }

  }

}


// 전체 복사
$("copy").addEventListener("click", async () => {

  const text = $("result").value;

  if (!text.trim()) {
    alert("복사할 내용이 없습니다.");
    return;
  }

  try {

    await navigator.clipboard.writeText(text);

    $("status").textContent = "복사 완료!";

  } catch {

    $("result").select();

    document.execCommand("copy");

    $("status").textContent = "복사 완료!";

  }

});


// 초기화
$("clear").addEventListener("click", () => {

  generation++;

  queue.length = 0;

  $("result").value = "";

  $("preview").style.display = "none";

  $("status").textContent = "초기화 완료";

});

</script>

</body>
</html>
